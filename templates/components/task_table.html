<!-- Task table: 3-level collapsible hierarchy (study -> purpose -> sheet -> rows) -->
<div class="space-y-3" x-ref="taskArea">
  <template x-for="study in taskGroups" :key="study.studyId">
    <div class="bg-white dark:bg-stone-900 rounded-lg border border-stone-200 dark:border-stone-800 overflow-hidden">

      <!-- Level 1: Study -->
      <button @click="study.open = !study.open"
              class="w-full flex items-center justify-between px-4 py-3 border-l-2 border-l-warm-500
                     hover:bg-stone-50 dark:hover:bg-stone-800/40 transition-colors">
        <span class="flex items-center gap-3">
          <svg :class="study.open ? 'rotate-90' : ''" class="w-3.5 h-3.5 text-stone-400 transition-transform"
               fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
          </svg>
          <span class="font-semibold text-stone-900 dark:text-stone-100 text-sm" x-text="study.studyId"></span>
        </span>
        <span class="flex items-center gap-2">
          <span class="text-[11px] text-stone-500 dark:text-stone-400 tabular-nums" x-text="study.taskCount + ' 项'"></span>
          <span class="text-stone-300 dark:text-stone-700">·</span>
          <span class="text-[11px] text-stone-400 dark:text-stone-500 tabular-nums" x-text="study.purposes.length + ' 日志'"></span>
        </span>
      </button>

      <!-- Level 2: Purpose -->
      <div x-show="study.open" x-collapse>
        <div class="border-t border-stone-100 dark:border-stone-800 bg-stone-50/60 dark:bg-stone-950/40">
          <template x-for="purpose in study.purposes" :key="purpose.purpose">
            <div class="border-b border-stone-100 dark:border-stone-800 last:border-0">
              <button @click="purpose.open = !purpose.open"
                      class="w-full flex items-center justify-between px-4 py-2 pl-10
                             hover:bg-stone-100/70 dark:hover:bg-stone-800/40 transition-colors">
                <span class="flex items-center gap-2">
                  <svg :class="purpose.open ? 'rotate-90' : ''" class="w-3 h-3 text-stone-400 transition-transform"
                       fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
                  </svg>
                  <span class="font-medium text-stone-700 dark:text-stone-300 text-sm" x-text="purpose.purpose"></span>
                </span>
                <span class="text-[11px] text-stone-400 dark:text-stone-500 tabular-nums" x-text="purpose.taskCount + ' 项'"></span>
              </button>

              <!-- Level 3: Sheet type -->
              <div x-show="purpose.open" x-collapse>
                <template x-for="sheet in purpose.sheets" :key="sheet.sheetType">
                  <div class="bg-white dark:bg-stone-900 border-t border-stone-100 dark:border-stone-800">
                    <button @click="sheet.open = !sheet.open"
                            class="w-full flex items-center justify-between px-4 py-1.5 pl-16
                                   text-[11px] text-stone-500 dark:text-stone-400 hover:text-stone-700 dark:hover:text-stone-200 transition-colors">
                      <span class="flex items-center gap-1.5">
                        <svg :class="sheet.open ? 'rotate-90' : ''" class="w-2.5 h-2.5 text-stone-400 transition-transform"
                             fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
                        </svg>
                        <span class="font-medium uppercase tracking-wider" x-text="sheet.sheetType"></span>
                      </span>
                      <span class="tabular-nums" x-text="sheet.tasks.length"></span>
                    </button>
                    <div x-show="sheet.open" x-collapse>
                      <div class="overflow-x-auto">
                        <table class="min-w-full text-sm">
                          <thead>
                            <tr class="bg-stone-50 dark:bg-stone-950/60 text-stone-500 dark:text-stone-400 text-[11px] uppercase tracking-wider border-t border-stone-100 dark:border-stone-800">
                              <th class="px-3 py-2 text-left font-medium">分类</th>
                              <th class="px-3 py-2 text-left font-medium">名称</th>
                              <th class="px-3 py-2 text-left font-medium">主做</th>
                              <th class="px-3 py-2 text-left font-medium">完成日</th>
                              <th class="px-3 py-2 text-left font-medium">状态</th>
                              <th class="px-3 py-2 text-left font-medium">QC</th>
                              <th class="px-3 py-2 text-left font-medium">QC 日</th>
                              <th class="px-3 py-2 text-left font-medium">QC 状态</th>
                              <th class="px-3 py-2 text-left font-medium">DDL</th>
                            </tr>
                          </thead>
                          <tbody class="divide-y divide-stone-100 dark:divide-stone-800">
                            <template x-for="(task, idx) in sheet.tasks" :key="idx">
                              <tr class="hover:bg-stone-50 dark:hover:bg-stone-800/30 transition-colors" :class="ddlUrgencyClass(task)">
                                <td class="px-3 py-2 whitespace-nowrap text-stone-500 dark:text-stone-500 text-xs" x-text="task.category || '—'"></td>
                                <td class="px-3 py-2 text-stone-800 dark:text-stone-200 font-medium max-w-xs truncate" :title="task.item_name" x-text="task.item_name || '—'"></td>
                                <td class="px-3 py-2 whitespace-nowrap text-xs text-stone-600 dark:text-stone-400" x-text="task.main_person || '—'"></td>
                                <td class="px-3 py-2 whitespace-nowrap text-stone-400 dark:text-stone-500 text-xs tabular-nums" x-text="task.main_date || '—'"></td>
                                <td class="px-3 py-2 whitespace-nowrap">
                                  <span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium"
                                        :class="statusBadge(task.main_status)"
                                        x-text="task.main_status || '进行中'"></span>
                                </td>
                                <td class="px-3 py-2 whitespace-nowrap text-xs text-stone-600 dark:text-stone-400" x-text="task.qc_person || '—'"></td>
                                <td class="px-3 py-2 whitespace-nowrap text-stone-400 dark:text-stone-500 text-xs tabular-nums" x-text="task.qc_date || '—'"></td>
                                <td class="px-3 py-2 whitespace-nowrap">
                                  <span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium"
                                        :class="statusBadge(task.qc_status)"
                                        x-text="task.qc_status || '进行中'"></span>
                                </td>
                                <td class="px-3 py-2 whitespace-nowrap font-mono text-xs tabular-nums"
                                    :class="ddlTextClass(task)"
                                    x-text="task.ddl || '—'"></td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>

  <!-- ==================== Custom Project Groups ==================== -->
  <template x-for="cg in customProjectGroups" :key="cg.studyId">
    <div class="bg-white dark:bg-stone-900 rounded-lg border border-stone-200 dark:border-stone-800 overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 border-l-2 border-l-warm-500">
        <span class="flex items-center gap-2.5">
          <span class="font-semibold text-stone-900 dark:text-stone-100 text-sm" x-text="cg.studyId"></span>
          <span class="text-[11px] bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-400 rounded-full px-2 py-0.5 font-medium"
                x-text="cg.tasks.length + ' 项自定义'"></span>
        </span>
        <button @click="openAddCustomTask(cg.studyId)"
                class="text-xs text-stone-500 hover:text-warm-600 rounded px-2 py-1 font-medium transition flex items-center gap-1">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
          </svg>
          新增
        </button>
      </div>
      <div class="overflow-x-auto border-t border-stone-100 dark:border-stone-800">
        <table class="min-w-full text-sm">
          <thead>
            <tr class="bg-stone-50 dark:bg-stone-950/60 text-stone-500 dark:text-stone-400 text-[11px] uppercase tracking-wider">
              <th class="px-3 py-2 text-left font-medium">任务</th>
              <th class="px-3 py-2 text-left font-medium">备注</th>
              <th class="px-3 py-2 text-left font-medium">主做</th>
              <th class="px-3 py-2 text-left font-medium">状态</th>
              <th class="px-3 py-2 text-left font-medium">QC</th>
              <th class="px-3 py-2 text-left font-medium">QC 状态</th>
              <th class="px-3 py-2 text-left font-medium">DDL</th>
              <th class="px-3 py-2 text-left font-medium">标签</th>
              <th class="px-3 py-2 text-left font-medium w-16"></th>
            </tr>
          </thead>
          <tbody class="divide-y divide-stone-100 dark:divide-stone-800">
            <template x-for="ct in cg.tasks" :key="ct.id">
              <tr class="hover:bg-stone-50 dark:hover:bg-stone-800/30 transition-colors group">
                <td class="px-3 py-2 text-stone-800 dark:text-stone-200 font-medium" x-text="ct.task_name"></td>
                <td class="px-3 py-2 text-stone-500 dark:text-stone-500 text-xs max-w-xs truncate" :title="ct.description" x-text="ct.description || '—'"></td>
                <td class="px-3 py-2 whitespace-nowrap text-xs text-stone-600 dark:text-stone-400" x-text="ct.main_person || '—'"></td>
                <td class="px-3 py-2 whitespace-nowrap">
                  <span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium"
                        :class="statusBadge(ct.main_status)"
                        x-text="ct.main_status || '—'"></span>
                </td>
                <td class="px-3 py-2 whitespace-nowrap text-xs text-stone-600 dark:text-stone-400" x-text="ct.qc_person || '—'"></td>
                <td class="px-3 py-2 whitespace-nowrap">
                  <span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium"
                        :class="statusBadge(ct.qc_status)"
                        x-text="ct.qc_status || '—'"></span>
                </td>
                <td class="px-3 py-2 whitespace-nowrap font-mono text-xs text-stone-500 dark:text-stone-400 tabular-nums" x-text="ct.ddl || '—'"></td>
                <td class="px-3 py-2">
                  <template x-for="tag in (ct.tags || [])" :key="tag">
                    <span class="text-[11px] bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-400 rounded px-1.5 py-0.5 mr-1" x-text="tag"></span>
                  </template>
                </td>
                <td class="px-3 py-2 whitespace-nowrap">
                  <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                    <button @click="openEditCustomTask(ct)" class="text-stone-400 hover:text-warm-600 transition p-0.5" title="编辑">
                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                      </svg>
                    </button>
                    <button @click="deleteCustomTask(ct.id)" class="text-stone-400 hover:text-rose-500 transition p-0.5" title="删除">
                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                      </svg>
                    </button>
                  </div>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </template>

  <!-- Add custom project -->
  <template x-if="dashboardLoaded">
    <button @click="openAddCustomTask('')"
            class="w-full py-2.5 border border-dashed border-stone-300 dark:border-stone-700 rounded-lg text-sm
                   text-stone-500 dark:text-stone-400 hover:border-warm-400 hover:text-warm-600 hover:bg-white dark:hover:bg-stone-900 transition
                   flex items-center justify-center gap-2 font-medium">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
      </svg>
      新增自定义任务
    </button>
  </template>

  <!-- No results -->
  <template x-if="dashboardLoaded && taskGroups.length === 0 && customProjectGroups.length === 0">
    <div class="text-center py-16">
      <div class="w-12 h-12 mx-auto rounded-full bg-stone-100 dark:bg-stone-800 flex items-center justify-center mb-3">
        <svg class="w-5 h-5 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
      <p class="text-sm text-stone-600 dark:text-stone-300 font-medium">没有符合条件的任务</p>
      <p class="text-xs text-stone-400 dark:text-stone-500 mt-1">试着调整左侧筛选条件</p>
    </div>
  </template>
</div>
