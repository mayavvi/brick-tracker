<!-- Summary cards: compact, monochrome, color only in the status dot & active state -->
<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
  <!-- Total -->
  <button @click="setStatusFilter('total')"
          class="group text-left rounded-lg border bg-white dark:bg-stone-900 px-4 py-3 transition"
          :class="statusFilter === 'total'
            ? 'border-warm-500 ring-1 ring-warm-500/30 bg-warm-50 dark:bg-warm-950/30'
            : 'border-stone-200 dark:border-stone-800 hover:border-stone-300 dark:hover:border-stone-700'">
    <div class="flex items-center gap-2 mb-1.5">
      <span class="w-1.5 h-1.5 rounded-full bg-stone-400"></span>
      <span class="text-[11px] font-medium text-stone-500 dark:text-stone-400">全部</span>
    </div>
    <p class="text-2xl font-semibold text-stone-900 dark:text-stone-100 tabular-nums leading-none" x-text="summary.total"></p>
  </button>

  <!-- In progress -->
  <button @click="setStatusFilter('in_progress')"
          class="group text-left rounded-lg border bg-white dark:bg-stone-900 px-4 py-3 transition"
          :class="statusFilter === 'in_progress'
            ? 'border-amber-400 ring-1 ring-amber-400/30 bg-amber-50 dark:bg-amber-950/20'
            : 'border-stone-200 dark:border-stone-800 hover:border-stone-300 dark:hover:border-stone-700'">
    <div class="flex items-center gap-2 mb-1.5">
      <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
      <span class="text-[11px] font-medium text-stone-500 dark:text-stone-400">进行中</span>
    </div>
    <p class="text-2xl font-semibold text-stone-900 dark:text-stone-100 tabular-nums leading-none" x-text="summary.in_progress"></p>
  </button>

  <!-- Completed ready QC -->
  <button @click="setStatusFilter('completed_ready_qc')"
          class="group text-left rounded-lg border bg-white dark:bg-stone-900 px-4 py-3 transition"
          :class="statusFilter === 'completed_ready_qc'
            ? 'border-sky-400 ring-1 ring-sky-400/30 bg-sky-50 dark:bg-sky-950/20'
            : 'border-stone-200 dark:border-stone-800 hover:border-stone-300 dark:hover:border-stone-700'">
    <div class="flex items-center gap-2 mb-1.5">
      <span class="w-1.5 h-1.5 rounded-full bg-sky-500"></span>
      <span class="text-[11px] font-medium text-stone-500 dark:text-stone-400">待 QC</span>
    </div>
    <p class="text-2xl font-semibold text-stone-900 dark:text-stone-100 tabular-nums leading-none" x-text="summary.completed_ready_qc"></p>
  </button>

  <!-- Has issues -->
  <button @click="setStatusFilter('has_issues')"
          class="group text-left rounded-lg border bg-white dark:bg-stone-900 px-4 py-3 transition"
          :class="statusFilter === 'has_issues'
            ? 'border-rose-400 ring-1 ring-rose-400/30 bg-rose-50 dark:bg-rose-950/20'
            : 'border-stone-200 dark:border-stone-800 hover:border-stone-300 dark:hover:border-stone-700'">
    <div class="flex items-center gap-2 mb-1.5">
      <span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>
      <span class="text-[11px] font-medium text-stone-500 dark:text-stone-400">有问题</span>
    </div>
    <p class="text-2xl font-semibold text-stone-900 dark:text-stone-100 tabular-nums leading-none" x-text="summary.has_issues"></p>
  </button>

  <!-- Pending -->
  <button @click="setStatusFilter('pending')"
          class="group text-left rounded-lg border bg-white dark:bg-stone-900 px-4 py-3 transition"
          :class="statusFilter === 'pending'
            ? 'border-stone-400 ring-1 ring-stone-400/30 bg-stone-100 dark:bg-stone-800/40'
            : 'border-stone-200 dark:border-stone-800 hover:border-stone-300 dark:hover:border-stone-700'">
    <div class="flex items-center gap-2 mb-1.5">
      <span class="w-1.5 h-1.5 rounded-full bg-stone-500"></span>
      <span class="text-[11px] font-medium text-stone-500 dark:text-stone-400">暂缓</span>
    </div>
    <p class="text-2xl font-semibold text-stone-900 dark:text-stone-100 tabular-nums leading-none" x-text="summary.pending"></p>
  </button>

  <!-- Closed -->
  <button @click="setStatusFilter('closed')"
          class="group text-left rounded-lg border bg-white dark:bg-stone-900 px-4 py-3 transition"
          :class="statusFilter === 'closed'
            ? 'border-emerald-400 ring-1 ring-emerald-400/30 bg-emerald-50 dark:bg-emerald-950/20'
            : 'border-stone-200 dark:border-stone-800 hover:border-stone-300 dark:hover:border-stone-700'">
    <div class="flex items-center gap-2 mb-1.5">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
      <span class="text-[11px] font-medium text-stone-500 dark:text-stone-400">已完成</span>
    </div>
    <p class="text-2xl font-semibold text-stone-900 dark:text-stone-100 tabular-nums leading-none" x-text="summary.closed"></p>
  </button>
</div>

<!-- Active filter indicator -->
<div x-show="statusFilter" x-transition
     class="flex items-center gap-2 text-xs text-stone-600 dark:text-stone-400 bg-white dark:bg-stone-900 rounded-md px-3 py-1.5 border border-stone-200 dark:border-stone-800">
  <span class="text-stone-400">筛选：</span>
  <strong class="text-stone-800 dark:text-stone-200 font-medium" x-text="{
    total: '全部',
    in_progress: '进行中',
    completed_ready_qc: '待 QC',
    has_issues: '有问题',
    pending: '暂缓',
    closed: '已完成',
  }[statusFilter]"></strong>
  <span class="text-stone-400 font-mono tabular-nums" x-text="'(' + tasks.length + ' / ' + allTasks.length + ')'"></span>
  <button @click="setStatusFilter(statusFilter)" class="ml-auto text-stone-400 hover:text-stone-700 dark:hover:text-stone-200 transition">
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
    </svg>
  </button>
</div>
