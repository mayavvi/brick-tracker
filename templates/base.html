<!DOCTYPE html>
<html lang="zh-CN" class="h-full antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}PEAK{% endblock %}</title>

  <!-- Theme flash prevention — dark-first -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('brick-theme');
        if (t !== 'light') document.documentElement.classList.add('dark');
      } catch (e) { document.documentElement.classList.add('dark'); }
      try {
        var fs = localStorage.getItem('brick-fontsize');
        var n = parseInt(fs, 10);
        if (isNaN(n) || n < 14 || n > 20) n = 16;
        document.documentElement.style.fontSize = n + 'px';
      } catch (e) { document.documentElement.style.fontSize = '16px'; }
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // "warm" 保留名字但重新绑定到电子青（主色）
            warm: {
              50:  '#E6FEFF',
              100: '#B8FAFF',
              200: '#7FF3FF',
              300: '#36E7FF',
              400: '#0DD1F2',
              500: '#06B6D4',  // cyan-500
              600: '#0891B2',
              700: '#0E7490',
              800: '#155E75',
              900: '#164E63',
              950: '#083344',
            },
            // 次色 — 品红 / 紫
            neon: {
              50:  '#FDF2FF',
              100: '#FAE0FF',
              200: '#F5BBFF',
              300: '#EE87FF',
              400: '#E247FF',
              500: '#D01FF6',
              600: '#B011D4',
              700: '#8C12A8',
              800: '#6B1384',
              900: '#4D1163',
            },
            // 背景 — 近黑深靛
            ink: {
              950: '#05070E',
              900: '#0A0E1A',
              850: '#0F1524',
              800: '#151B2E',
              700: '#1E2741',
              600: '#2A3454',
            },
          },
          fontFamily: {
            sans: ['"Segoe UI"', '"Microsoft YaHei"', '"PingFang SC"', '"Helvetica Neue"', 'Arial', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'],
          },
          boxShadow: {
            'soft':  '0 1px 2px 0 rgb(0 0 0 / 0.3)',
            'card':  '0 4px 16px -4px rgb(0 0 0 / 0.4)',
            'pop':   '0 20px 50px -12px rgb(0 0 0 / 0.7), 0 0 30px -6px rgb(6 182 212 / 0.15)',
            'glow':  '0 0 20px rgb(6 182 212 / 0.35), 0 0 40px rgb(6 182 212 / 0.15)',
            'glow-lg': '0 0 28px rgb(6 182 212 / 0.5), 0 0 60px rgb(208 31 246 / 0.2)',
            'glow-neon': '0 0 20px rgb(208 31 246 / 0.4), 0 0 40px rgb(208 31 246 / 0.15)',
          },
          backgroundImage: {
            'neon-grad': 'linear-gradient(135deg, #06B6D4 0%, #D01FF6 100%)',
            'neon-grad-h': 'linear-gradient(90deg, #06B6D4 0%, #D01FF6 50%, #06B6D4 100%)',
          },
          animation: {
            'gradient-x': 'gradient-x 4s ease infinite',
            'pulse-glow': 'pulse-glow 2.5s ease-in-out infinite',
          },
          keyframes: {
            'gradient-x': {
              '0%, 100%': { 'background-position': '0% 50%' },
              '50%':      { 'background-position': '100% 50%' },
            },
            'pulse-glow': {
              '0%, 100%': { 'box-shadow': '0 0 16px rgb(6 182 212 / 0.35)' },
              '50%':      { 'box-shadow': '0 0 26px rgb(6 182 212 / 0.65), 0 0 40px rgb(208 31 246 / 0.25)' },
            },
          },
        }
      }
    }
  </script>

  <!-- Alpine stores -->
  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.store('toast', {
        items: [],
        push(msg, type, duration) {
          type = type || 'info';
          duration = duration || 3500;
          const id = Date.now() + Math.random();
          this.items.push({ id, msg, type });
          setTimeout(() => this.remove(id), duration);
        },
        remove(id) { this.items = this.items.filter(i => i.id !== id); }
      });

      Alpine.store('theme', {
        dark: document.documentElement.classList.contains('dark'),
        toggle() {
          this.dark = !this.dark;
          document.documentElement.classList.toggle('dark', this.dark);
          try { localStorage.setItem('brick-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
        }
      });

      Alpine.store('confirm', {
        open: false,
        message: '',
        _resolve: null,
        ask(msg) {
          this.message = msg;
          this.open = true;
          return new Promise(resolve => { this._resolve = resolve; });
        },
        yes() { this.open = false; this._resolve && this._resolve(true); },
        no()  { this.open = false; this._resolve && this._resolve(false); }
      });

      (function brickFontSizeInit() {
        var n = 16;
        try {
          var s = localStorage.getItem('brick-fontsize');
          var parsed = parseInt(s, 10);
          if (!isNaN(parsed) && parsed >= 14 && parsed <= 20) n = parsed;
        } catch (e) {}
        Alpine.store('fontSize', {
          current: n,
          set(v) {
            v = Math.max(14, Math.min(20, +v));
            this.current = v;
            document.documentElement.style.fontSize = v + 'px';
            try { localStorage.setItem('brick-fontsize', String(v)); } catch (e) {}
          },
        });
        document.documentElement.style.fontSize = n + 'px';
      })();
    });
  </script>

  <script src="{{ url_for('static', path='js/greetings.js') }}"></script>
  <script src="{{ url_for('static', path='js/cyber-fx.js') }}"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}" />
</head>

<body class="h-full bg-ink-950 text-stone-100 font-sans antialiased transition-colors duration-200 cyber-bg">
  <canvas id="cfx-particles" class="cfx-particles" aria-hidden="true"></canvas>

  <script>
  (function() {
    var p = (window.location.pathname || "").replace(/\/+$/, "");
    var strip = ["/tracker", "/file-compare", "/me"];
    for (var i = 0; i < strip.length; i++) {
      if (p.endsWith(strip[i])) {
        p = p.slice(0, p.length - strip[i].length);
        break;
      }
    }
    window.API_BASE = p;
    if (p === "") return;
    var _f = window.fetch;
    window.fetch = function(input) {
      if (typeof input === "string" && input.startsWith("/api/")) {
        arguments[0] = p + input;
      }
      return _f.apply(this, arguments);
    };
  })();
  </script>

  {% if shell_header | default(true) %}

        <div class="relative flex-shrink-0">
          <button type="button"
                  @click="menuOpen = !menuOpen"

                  :aria-expanded="menuOpen ? 'true' : 'false'"
                  class="p-2 rounded-md hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-500 dark:text-stone-400 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>

          <template x-teleport="body">
            <div x-show="menuOpen"
                 x-transition:enter="transition ease-out duration-150"
                 x-transition:enter-start="opacity-0"
                 x-transition:enter-end="opacity-100"
                 x-transition:leave="transition ease-in duration-100"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0"
                 @click="menuOpen = false"
                 class="fixed inset-0 calendar-backdrop z-[196]"></div>
          </template>

          <template x-teleport="body">
            <div x-show="menuOpen"
                 x-transition:enter="transition ease-out duration-150"
                 x-transition:enter-start="opacity-0 scale-95 -translate-y-1"
                 x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                 @click.stop
                 class="fixed top-14 left-4 w-56 bg-white dark:bg-stone-900 rounded-xl shadow-pop ring-1 ring-stone-200 dark:ring-stone-800 py-1 z-[197]">
              <a :href="navUrl('/')" @click="menuOpen=false"
                 class="flex items-center gap-2 px-3 py-2 text-sm rounded-lg mx-1 transition"
                 :class="moduleItemClass('welcome')">
                <span class="text-base">⌂</span> 欢迎首页
              </a>
              <a :href="navUrl('/tracker')" @click="menuOpen=false"
                 class="flex items-center gap-2 px-3 py-2 text-sm rounded-lg mx-1 transition"
                 :class="moduleItemClass('tracker')">
                <span class="text-base">◆</span> 日志追踪
              </a>
              <a :href="navUrl('/file-compare')" @click="menuOpen=false"
                 class="flex items-center gap-2 px-3 py-2 text-sm rounded-lg mx-1 transition"
                 :class="moduleItemClass('file-compare')">
                <span class="text-base">⧉</span> 文件预览与比对
              </a>
              <a :href="navUrl('/me')" @click="menuOpen=false"
                 class="flex items-center gap-2 px-3 py-2 text-sm rounded-lg mx-1 transition"
                 :class="moduleItemClass('me')">
                <span class="text-base">◈</span> 个人工作台
              </a>
            </div>
          </template>
        </div>

        <a :href="navUrl('/')" class="flex items-center gap-3 min-w-0 group">
          <img src="{{ url_for('static', path='img/PEAK logo.png') }}" alt="PEAK" width="120" height="32" class="h-8 w-auto flex-shrink-0 object-contain" />
          <div class="leading-tight min-w-0">
            <h1 class="text-[15px] font-bold tracking-tight flex items-center gap-2 flex-wrap">
              <span data-cfx-glitch class="bg-gradient-to-r from-warm-300 via-neon-300 to-warm-300 bg-clip-text text-transparent">PEAK</span>
            </h1>
            <p class="text-[11px] text-stone-500 dark:text-stone-400 truncate max-w-[30rem] font-mono">Climb Higher. Work Smarter.</p>
            <p id="cfx-greeting" class="cfx-typing text-[11px] text-stone-500 dark:text-stone-400 truncate max-w-[30rem] font-mono"></p>
          </div>
        </a>
      </div>

      <div class="flex items-center gap-1.5 flex-shrink-0">
        <div class="relative">
          <button type="button" @click="showCalendar = !showCalendar"
                  class="flex items-center gap-1.5 text-xs text-stone-600 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-100
                         px-2.5 h-8 rounded-md hover:bg-stone-100 dark:hover:bg-stone-800 transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <span x-text="todayStr" class="font-mono tabular-nums"></span>
          </button>

          <template x-teleport="body">
            <div x-show="showCalendar"
                 x-transition:enter="transition ease-out duration-150"
                 x-transition:enter-start="opacity-0"
                 x-transition:enter-end="opacity-100"
                 x-transition:leave="transition ease-in duration-100"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0"
                 @click="showCalendar = false"
                 class="fixed inset-0 calendar-backdrop z-[198]"></div>
          </template>

          <template x-teleport="body">
            <div x-show="showCalendar"
                 x-transition:enter="transition ease-out duration-150"
                 x-transition:enter-start="opacity-0 scale-95 -translate-y-1"
                 x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                 @click.outside="showCalendar = false"
                 class="fixed top-14 right-4 w-72 bg-white dark:bg-stone-900 rounded-xl shadow-pop ring-1 ring-stone-200 dark:ring-stone-800 p-4 z-[199]">
              <div class="flex items-center justify-between mb-3">
                <button type="button" @click="calPrev()" class="p-1 rounded-md hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-500 transition">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
                  </svg>
                </button>
                <button type="button" @click="calToday()" class="text-sm font-semibold text-stone-800 dark:text-stone-200 hover:text-warm-600 transition" x-text="calTitle"></button>
                <button type="button" @click="calNext()" class="p-1 rounded-md hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-500 transition">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
                  </svg>
                </button>
              </div>
              <div class="calendar-grid mb-1">
                <template x-for="wd in ['一','二','三','四','五','六','日']" :key="wd">
                  <div class="cal-cell text-stone-400 dark:text-stone-500 font-medium text-xs" x-text="wd"></div>
                </template>
              </div>
              <div class="calendar-grid">
                <template x-for="(d, idx) in calDays" :key="idx">
                  <div class="cal-cell"
                       :class="{ 'today': d.today, 'other-month': d.other }"
                       x-text="d.day"></div>
                </template>
              </div>
            </div>
          </template>
        </div>

        <button type="button" @click="$store.theme.toggle(); _scheduleSaveTheme()"
                aria-label="切换主题"
                class="p-2 rounded-md hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-500 dark:text-stone-400 transition">
          <svg x-show="!$store.theme.dark" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
          <svg x-show="$store.theme.dark" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
        </button>

        <div class="relative" x-show="currentUser">
          <button type="button" @click="userMenuOpen = !userMenuOpen"
                  class="flex items-center gap-2 pl-1 pr-2 h-8 rounded-full hover:bg-stone-100 dark:hover:bg-stone-800 transition">
            <span class="w-6 h-6 rounded-full bg-warm-500 text-white flex items-center justify-center text-[11px] font-semibold"
                  x-text="currentUser ? (currentUser.display_name || currentUser.username || '?').charAt(0).toUpperCase() : '?'"></span>
            <span class="text-xs font-medium text-stone-700 dark:text-stone-300 hidden sm:inline max-w-[8rem] truncate"
                  x-text="currentUser ? (currentUser.display_name || currentUser.username) : ''"></span>
            <svg class="w-3 h-3 text-stone-400 transition-transform" :class="userMenuOpen ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>

          <template x-teleport="body">
            <div x-show="userMenuOpen"
                 x-transition:enter="transition ease-out duration-150"
                 x-transition:enter-start="opacity-0"
                 x-transition:enter-end="opacity-100"
                 x-transition:leave="transition ease-in duration-100"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0"
                 @click="userMenuOpen = false"
                 class="fixed inset-0 calendar-backdrop z-[194]"></div>
          </template>

          <template x-teleport="body">
            <div x-show="userMenuOpen"
                 x-transition:enter="transition ease-out duration-150"
                 x-transition:enter-start="opacity-0 scale-95 -translate-y-1"
                 x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                 @click.stop
                 class="fixed top-14 right-4 w-52 bg-white dark:bg-stone-900 rounded-xl shadow-pop ring-1 ring-stone-200 dark:ring-stone-800 py-1 z-[195]">
              <a :href="navUrl('/me')" @click="userMenuOpen=false"
                 class="flex items-center gap-2 px-3 py-2 text-sm text-stone-700 dark:text-stone-300 hover:bg-stone-50 dark:hover:bg-stone-800 transition">
                <svg class="w-4 h-4 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
                个人工作台
              </a>
              <div class="px-3 py-2 border-t border-stone-100 dark:border-stone-800">
                <label class="flex items-center justify-between text-xs text-stone-500 dark:text-stone-400 mb-1">
                  <span>字号</span>
                  <span class="font-mono tabular-nums" x-text="$store.fontSize.current + 'px'"></span>
                </label>
                <input type="range" min="14" max="20" step="1"
                       :value="$store.fontSize.current"
                       @input="$store.fontSize.set(+$event.target.value)"
                       class="w-full h-1 accent-warm-500 cursor-pointer" />
              </div>
              <button type="button" @click="$store.theme.toggle(); _scheduleSaveTheme(); userMenuOpen=false"
                      class="w-full flex items-center gap-2 px-3 py-2 text-sm text-stone-700 dark:text-stone-300 hover:bg-stone-50 dark:hover:bg-stone-800 transition text-left">
                <svg class="w-4 h-4 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                </svg>
                <span x-text="$store.theme.dark ? '切换为浅色' : '切换为深色'"></span>
              </button>
            </div>
          </template>
        </div>
      </div>
    </div>
    <div class="neon-rail"></div>
  </header>
  {% endif %}

  {% block body %}{% endblock %}

  <!-- ============ Toast stack ============ -->
  <div x-data x-cloak
       class="fixed bottom-5 right-5 z-[200] flex flex-col gap-2 pointer-events-none w-[22rem] max-w-[calc(100vw-2rem)]">
    <template x-for="toast in $store.toast.items" :key="toast.id">
      <div x-transition:enter="transition ease-out duration-300"
           x-transition:enter-start="opacity-0 translate-x-3"
           x-transition:enter-end="opacity-100 translate-x-0"
           x-transition:leave="transition ease-in duration-200"
           x-transition:leave-start="opacity-100"
           x-transition:leave-end="opacity-0 translate-x-2"
           class="pointer-events-auto relative overflow-hidden flex items-start gap-3 px-4 py-3 rounded-xl shadow-pop ring-1 text-sm bg-white dark:bg-stone-900"
           :class="{
             'ring-emerald-200 dark:ring-emerald-900/60': toast.type === 'success',
             'ring-rose-200 dark:ring-rose-900/60':       toast.type === 'error',
             'ring-stone-200 dark:ring-stone-800':        toast.type === 'info',
             'ring-amber-200 dark:ring-amber-900/60':     toast.type === 'warning'
           }">
        <span class="flex-shrink-0 w-5 h-5 rounded-full flex items-center justify-center mt-0.5"
              :class="{
                'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-400': toast.type === 'success',
                'bg-rose-100 text-rose-700 dark:bg-rose-900/40 dark:text-rose-400':             toast.type === 'error',
                'bg-stone-100 text-stone-700 dark:bg-stone-800 dark:text-stone-300':            toast.type === 'info',
                'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-400':        toast.type === 'warning'
              }">
          <svg x-show="toast.type === 'success'" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
          </svg>
          <svg x-show="toast.type === 'error'" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"/>
          </svg>
          <svg x-show="toast.type === 'info'" class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
            <circle cx="10" cy="10" r="4"/>
          </svg>
          <svg x-show="toast.type === 'warning'" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 9v3m0 4h.01"/>
          </svg>
        </span>
        <span x-text="toast.msg" class="flex-1 text-stone-800 dark:text-stone-200 font-medium leading-5 pt-px"></span>
        <button @click="$store.toast.remove(toast.id)"
                class="flex-shrink-0 text-stone-400 hover:text-stone-600 dark:text-stone-500 dark:hover:text-stone-300 transition mt-px">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
        <span class="cfx-toast-bar"></span>
      </div>
    </template>
  </div>

  <!-- ============ Confirm Dialog ============ -->
  <div x-data x-cloak
       x-show="$store.confirm.open"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       x-transition:leave="transition ease-in duration-150"
       class="fixed inset-0 z-[300] flex items-center justify-center modal-backdrop">
    <div x-show="$store.confirm.open"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         class="cfx-corners bg-white dark:bg-stone-900 rounded-2xl shadow-pop ring-1 ring-stone-200 dark:ring-stone-800 max-w-sm w-full mx-4 p-6">
      <div class="flex items-start gap-4 mb-5">
        <div class="flex-shrink-0 w-10 h-10 rounded-full bg-rose-50 dark:bg-rose-950/40 ring-1 ring-rose-200 dark:ring-rose-900/60 flex items-center justify-center">
          <svg class="w-5 h-5 text-rose-600 dark:text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M5 19h14a2 2 0 001.84-2.75L13.74 4a2 2 0 00-3.48 0l-7.1 12.25A2 2 0 005 19z"/>
          </svg>
        </div>
        <p class="flex-1 min-w-0 pt-1.5 text-base font-medium text-stone-900 dark:text-stone-100 leading-6"
           x-text="$store.confirm.message"></p>
      </div>
      <div class="flex justify-end gap-2">
        <button @click="$store.confirm.no()"
                class="px-3.5 h-9 text-sm font-medium text-stone-700 dark:text-stone-300 bg-stone-100 dark:bg-stone-800 rounded-lg hover:bg-stone-200 dark:hover:bg-stone-700 transition">
          取消
        </button>
        <button @click="$store.confirm.yes()"
                class="px-3.5 h-9 text-sm font-medium text-white bg-rose-600 rounded-lg hover:bg-rose-700 transition shadow-sm">
          确认
        </button>
      </div>
    </div>
  </div>

  <!-- ============ Keyboard Shortcuts ============ -->
  <div x-data="{ open: false }"
       @keydown.window.prevent.shift.?="open = !open"
       @keydown.window.esc="open = false"
       x-cloak>
    <div x-show="open"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         @click.self="open = false"
         class="fixed inset-0 z-[250] flex items-center justify-center modal-backdrop">
      <div x-show="open"
           x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="opacity-0 scale-95"
           x-transition:enter-end="opacity-100 scale-100"
           class="cfx-corners bg-white dark:bg-stone-900 rounded-2xl shadow-pop ring-1 ring-stone-200 dark:ring-stone-800 max-w-sm w-full mx-4 p-6">
        <div class="flex items-center justify-between mb-5">
          <div class="flex items-center gap-2">
            <svg class="w-4 h-4 text-stone-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <h3 class="text-sm font-semibold text-stone-900 dark:text-stone-100">键盘快捷键</h3>
          </div>
          <button @click="open = false"
                  class="text-stone-400 hover:text-stone-600 dark:hover:text-stone-300 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div class="space-y-2 text-sm text-stone-700 dark:text-stone-300">
          <div class="flex justify-between items-center py-1"><span>显示此面板</span><kbd>?</kbd></div>
          <div class="flex justify-between items-center py-1"><span>聚焦搜索</span><kbd>/</kbd></div>
          <div class="flex justify-between items-center py-1"><span>刷新数据</span><kbd>r</kbd></div>
          <div class="flex justify-between items-center py-1"><span>切换主题</span><kbd>d</kbd></div>
          <div class="flex justify-between items-center py-1"><span>关闭弹窗</span><kbd>Esc</kbd></div>
          <div class="flex justify-between items-center py-1"><span>战术侦察 · 悬停看详情</span><kbd>Space</kbd></div>
          <div class="flex justify-between items-center py-1"><span>跳转工作台</span><span class="flex gap-1"><kbd>g</kbd><kbd>m</kbd></span></div>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', path='js/header.js') }}"></script>
  {% block app_scripts %}
  <script src="{{ url_for('static', path='js/app.js') }}"></script>
  <script src="{{ url_for('static', path='js/charts.js') }}"></script>
  <script src="{{ url_for('static', path='js/radar.js') }}"></script>
  {% endblock %}
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.CyberFX) {
        CyberFX.initParticles(document.getElementById('cfx-particles'));
        CyberFX.autoTilt();
        CyberFX.bindGlitch();
        CyberFX.autoSpotlight();
        const hud = document.getElementById('cfx-hud-ticker');
        if (hud) CyberFX.initHudTicker(hud);
        CyberFX.initCommandPalette(function () {
          const root = document.querySelector('[data-tracker-app]');
          const app = root && root._x_dataStack ? root._x_dataStack[0] : null;
          const headerEl = document.querySelector('header[x-data]');
          const headerApp = headerEl && headerEl._x_dataStack ? headerEl._x_dataStack[0] : null;
          const base = window.API_BASE || '';
          return [
            { icon: '⚡', label: '装载看板 · Load Dashboard', key: 'Enter', run: () => app && app.loadDashboard && app.loadDashboard() },
            { icon: '⟲', label: '刷新项目列表 · Sync', key: 'R', run: () => app && app.refreshProjectList && app.refreshProjectList() },
            { icon: '◐', label: '切换主题 · Toggle Theme', key: 'D', run: () => {
                Alpine.store('theme').toggle();
                if (app && app._scheduleSavePrefs) app._scheduleSavePrefs();
                else if (headerApp && headerApp._scheduleSaveTheme) headerApp._scheduleSaveTheme();
              } },
            { icon: '◆', label: '展开/收起图表 · Toggle Charts', key: 'C', run: () => app && app.toggleCharts && app.toggleCharts() },
            { icon: '⌕', label: '聚焦搜索 · Focus Search', key: '/', run: () => { const el = document.getElementById('study-search-input'); if (el) el.focus(); } },
            { icon: '＋', label: '新增任务 · New Custom Task', run: () => app && app.openAddCustomTask && app.openAddCustomTask('') },
            { icon: '⌫', label: '清除状态筛选 · Clear Filter', run: () => { if (app) app.statusFilter = ''; } },
            { icon: '◈', label: '跳转个人工作台 · Go to /me', key: 'G M', run: () => { window.location.href = (base || '') + '/me'; } },
            { icon: '◇', label: '日志追踪 · Tracker', run: () => { window.location.href = (base || '') + '/tracker'; } },
            { icon: '⌂', label: '回到首页 · Home', run: () => { window.location.href = (base || '') + (base ? '/' : '/'); } },
            { icon: '?', label: '键盘快捷键', key: '?', run: () => { window.dispatchEvent(new KeyboardEvent('keydown', { key: '?', shiftKey: true })); } },
          ];
        });
      }
    });
    // Re-bind on Alpine DOM updates
    document.addEventListener('alpine:initialized', () => {
      setTimeout(() => {
        if (window.CyberFX) { CyberFX.autoTilt(); CyberFX.bindGlitch(); CyberFX.autoSpotlight(); }
      }, 50);
    });
  </script>
</body>
</html>
