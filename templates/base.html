<!DOCTYPE html>
<html lang="zh-CN" class="h-full antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}打工人の进度小站{% endblock %}</title>

  <!-- Theme flash prevention -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('brick-theme');
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            warm: {
              50:  '#FFF8EB',
              100: '#FEECCA',
              200: '#FCD592',
              300: '#FAB955',
              400: '#F79625',
              500: '#E97A0E',
              600: '#C75E0A',
              700: '#A04A0C',
              800: '#7F3B0F',
              900: '#663112',
              950: '#3A1906',
            }
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont',
                   '"Segoe UI"', 'Roboto', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', '"SF Mono"', 'Menlo', 'Consolas', 'monospace'],
          },
          boxShadow: {
            'soft':  '0 1px 2px 0 rgb(28 25 23 / 0.04), 0 1px 1px 0 rgb(28 25 23 / 0.02)',
            'card':  '0 1px 3px 0 rgb(28 25 23 / 0.04), 0 1px 2px -1px rgb(28 25 23 / 0.03)',
            'pop':   '0 12px 32px -8px rgb(28 25 23 / 0.12), 0 4px 12px -4px rgb(28 25 23 / 0.06)',
          }
        }
      }
    }
  </script>

  <!-- Alpine stores -->
  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.store('toast', {
        items: [],
        push(msg, type, duration) {
          type = type || 'info';
          duration = duration || 3500;
          const id = Date.now() + Math.random();
          this.items.push({ id, msg, type });
          setTimeout(() => this.remove(id), duration);
        },
        remove(id) { this.items = this.items.filter(i => i.id !== id); }
      });

      Alpine.store('theme', {
        dark: document.documentElement.classList.contains('dark'),
        toggle() {
          this.dark = !this.dark;
          document.documentElement.classList.toggle('dark', this.dark);
          try { localStorage.setItem('brick-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
        }
      });

      Alpine.store('confirm', {
        open: false,
        message: '',
        _resolve: null,
        ask(msg) {
          this.message = msg;
          this.open = true;
          return new Promise(resolve => { this._resolve = resolve; });
        },
        yes() { this.open = false; this._resolve && this._resolve(true); },
        no()  { this.open = false; this._resolve && this._resolve(false); }
      });
    });
  </script>

  <script src="/static/js/greetings.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>

<body class="h-full bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-stone-100 font-sans antialiased transition-colors duration-200">
  {% block body %}{% endblock %}

  <!-- ============ Toast stack ============ -->
  <div x-data x-cloak
       class="fixed bottom-5 right-5 z-[200] flex flex-col gap-2 pointer-events-none w-[22rem] max-w-[calc(100vw-2rem)]">
    <template x-for="toast in $store.toast.items" :key="toast.id">
      <div x-transition:enter="transition ease-out duration-300"
           x-transition:enter-start="opacity-0 translate-x-3"
           x-transition:enter-end="opacity-100 translate-x-0"
           x-transition:leave="transition ease-in duration-200"
           x-transition:leave-start="opacity-100"
           x-transition:leave-end="opacity-0 translate-x-2"
           class="pointer-events-auto flex items-start gap-3 px-4 py-3 rounded-xl shadow-pop ring-1 text-sm bg-white dark:bg-stone-900"
           :class="{
             'ring-emerald-200 dark:ring-emerald-900/60': toast.type === 'success',
             'ring-rose-200 dark:ring-rose-900/60':       toast.type === 'error',
             'ring-stone-200 dark:ring-stone-800':        toast.type === 'info',
             'ring-amber-200 dark:ring-amber-900/60':     toast.type === 'warning'
           }">
        <span class="flex-shrink-0 w-5 h-5 rounded-full flex items-center justify-center mt-0.5"
              :class="{
                'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-400': toast.type === 'success',
                'bg-rose-100 text-rose-700 dark:bg-rose-900/40 dark:text-rose-400':             toast.type === 'error',
                'bg-stone-100 text-stone-700 dark:bg-stone-800 dark:text-stone-300':            toast.type === 'info',
                'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-400':        toast.type === 'warning'
              }">
          <svg x-show="toast.type === 'success'" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
          </svg>
          <svg x-show="toast.type === 'error'" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"/>
          </svg>
          <svg x-show="toast.type === 'info'" class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
            <circle cx="10" cy="10" r="4"/>
          </svg>
          <svg x-show="toast.type === 'warning'" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 9v3m0 4h.01"/>
          </svg>
        </span>
        <span x-text="toast.msg" class="flex-1 text-stone-800 dark:text-stone-200 font-medium leading-5 pt-px"></span>
        <button @click="$store.toast.remove(toast.id)"
                class="flex-shrink-0 text-stone-400 hover:text-stone-600 dark:text-stone-500 dark:hover:text-stone-300 transition mt-px">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </template>
  </div>

  <!-- ============ Confirm Dialog ============ -->
  <div x-data x-cloak
       x-show="$store.confirm.open"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       x-transition:leave="transition ease-in duration-150"
       class="fixed inset-0 z-[300] flex items-center justify-center modal-backdrop">
    <div x-show="$store.confirm.open"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         class="bg-white dark:bg-stone-900 rounded-2xl shadow-pop ring-1 ring-stone-200 dark:ring-stone-800 max-w-sm w-full mx-4 p-6">
      <div class="flex items-start gap-4 mb-5">
        <div class="flex-shrink-0 w-10 h-10 rounded-full bg-rose-50 dark:bg-rose-950/40 ring-1 ring-rose-200 dark:ring-rose-900/60 flex items-center justify-center">
          <svg class="w-5 h-5 text-rose-600 dark:text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M5 19h14a2 2 0 001.84-2.75L13.74 4a2 2 0 00-3.48 0l-7.1 12.25A2 2 0 005 19z"/>
          </svg>
        </div>
        <p class="flex-1 min-w-0 pt-1.5 text-base font-medium text-stone-900 dark:text-stone-100 leading-6"
           x-text="$store.confirm.message"></p>
      </div>
      <div class="flex justify-end gap-2">
        <button @click="$store.confirm.no()"
                class="px-3.5 h-9 text-sm font-medium text-stone-700 dark:text-stone-300 bg-stone-100 dark:bg-stone-800 rounded-lg hover:bg-stone-200 dark:hover:bg-stone-700 transition">
          取消
        </button>
        <button @click="$store.confirm.yes()"
                class="px-3.5 h-9 text-sm font-medium text-white bg-rose-600 rounded-lg hover:bg-rose-700 transition shadow-sm">
          确认
        </button>
      </div>
    </div>
  </div>

  <!-- ============ Keyboard Shortcuts ============ -->
  <div x-data="{ open: false }"
       @keydown.window.prevent.shift.?="open = !open"
       @keydown.window.esc="open = false"
       x-cloak>
    <div x-show="open"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         @click.self="open = false"
         class="fixed inset-0 z-[250] flex items-center justify-center modal-backdrop">
      <div x-show="open"
           x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="opacity-0 scale-95"
           x-transition:enter-end="opacity-100 scale-100"
           class="bg-white dark:bg-stone-900 rounded-2xl shadow-pop ring-1 ring-stone-200 dark:ring-stone-800 max-w-sm w-full mx-4 p-6">
        <div class="flex items-center justify-between mb-5">
          <div class="flex items-center gap-2">
            <svg class="w-4 h-4 text-stone-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <h3 class="text-sm font-semibold text-stone-900 dark:text-stone-100">键盘快捷键</h3>
          </div>
          <button @click="open = false"
                  class="text-stone-400 hover:text-stone-600 dark:hover:text-stone-300 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div class="space-y-2 text-sm text-stone-700 dark:text-stone-300">
          <div class="flex justify-between items-center py-1"><span>显示此面板</span><kbd>?</kbd></div>
          <div class="flex justify-between items-center py-1"><span>聚焦搜索</span><kbd>/</kbd></div>
          <div class="flex justify-between items-center py-1"><span>刷新数据</span><kbd>r</kbd></div>
          <div class="flex justify-between items-center py-1"><span>切换主题</span><kbd>d</kbd></div>
          <div class="flex justify-between items-center py-1"><span>关闭弹窗</span><kbd>Esc</kbd></div>
          <div class="flex justify-between items-center py-1"><span>跳转工作台</span><span class="flex gap-1"><kbd>g</kbd><kbd>m</kbd></span></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/charts.js"></script>
</body>
</html>
