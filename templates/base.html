<!DOCTYPE html>
<html lang="zh-CN" class="h-full antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}PEAK{% endblock %}</title>

  <!-- Font-size flash prevention -->
  <script>
    (function () {
      try {
        var fs = localStorage.getItem('brick-fontsize');
        var n = parseInt(fs, 10);
        if (isNaN(n) || n < 14 || n > 20) n = 16;
        document.documentElement.style.fontSize = n + 'px';
      } catch (e) { document.documentElement.style.fontSize = '16px'; }
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            warm: {
              50:  '#F4FBF8',
              100: '#DDF3EA',
              200: '#B9E4D6',
              300: '#86CFB9',
              400: '#4CB295',
              500: '#2E9279',
              600: '#247662',
              700: '#205F51',
              800: '#184A40',
              900: '#123832',
            },
            neon: {
              50:  '#FFF4F8',
              100: '#FFE3EE',
              200: '#FCC9DC',
              300: '#F4A9C7',
              400: '#E986B0',
              500: '#DB5D91',
              600: '#C2497C',
              700: '#A73568',
              800: '#842B55',
              900: '#632240',
            },
            // 背景 — 近黑深靛
            ink: {
              950: '#05070E',
              900: '#0A0E1A',
              850: '#0F1524',
              800: '#151B2E',
              700: '#1E2741',
              600: '#2A3454',
            },
          },
          fontFamily: {
            sans: ['"Segoe UI"', '"Microsoft YaHei"', '"PingFang SC"', '"Helvetica Neue"', 'Arial', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'],
          },
          boxShadow: {
            'soft':  '0 1px 2px 0 rgb(0 0 0 / 0.3)',
            'card':  '0 4px 16px -4px rgb(0 0 0 / 0.4)',
            'pop':   '0 20px 50px -12px rgb(0 0 0 / 0.7), 0 0 30px -6px rgb(6 182 212 / 0.15)',
            'glow':  '0 0 20px rgb(6 182 212 / 0.35), 0 0 40px rgb(6 182 212 / 0.15)',
            'glow-lg': '0 0 28px rgb(6 182 212 / 0.5), 0 0 60px rgb(208 31 246 / 0.2)',
            'glow-neon': '0 0 20px rgb(208 31 246 / 0.4), 0 0 40px rgb(208 31 246 / 0.15)',
          },
          backgroundImage: {
            'neon-grad': 'linear-gradient(135deg, #06B6D4 0%, #D01FF6 100%)',
            'neon-grad-h': 'linear-gradient(90deg, #06B6D4 0%, #D01FF6 50%, #06B6D4 100%)',
          },
          animation: {
            'gradient-x': 'gradient-x 4s ease infinite',
            'pulse-glow': 'pulse-glow 2.5s ease-in-out infinite',
          },
          keyframes: {
            'gradient-x': {
              '0%, 100%': { 'background-position': '0% 50%' },
              '50%':      { 'background-position': '100% 50%' },
            },
            'pulse-glow': {
              '0%, 100%': { 'box-shadow': '0 0 16px rgb(6 182 212 / 0.35)' },
              '50%':      { 'box-shadow': '0 0 26px rgb(6 182 212 / 0.65), 0 0 40px rgb(208 31 246 / 0.25)' },
            },
          },
        }
      }
    }
  </script>

  <!-- Alpine stores -->
  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.store('toast', {
        items: [],
        push(msg, type, duration) {
          type = type || 'info';
          duration = duration || 3500;
          const id = Date.now() + Math.random();
          this.items.push({ id, msg, type });
          setTimeout(() => this.remove(id), duration);
        },
        remove(id) { this.items = this.items.filter(i => i.id !== id); }
      });

      Alpine.store('confirm', {
        open: false,
        message: '',
        _resolve: null,
        ask(msg) {
          this.message = msg;
          this.open = true;
          return new Promise(resolve => { this._resolve = resolve; });
        },
        yes() { this.open = false; this._resolve && this._resolve(true); },
        no()  { this.open = false; this._resolve && this._resolve(false); }
      });

      (function brickFontSizeInit() {
        var n = 16;
        try {
          var s = localStorage.getItem('brick-fontsize');
          var parsed = parseInt(s, 10);
          if (!isNaN(parsed) && parsed >= 14 && parsed <= 20) n = parsed;
        } catch (e) {}
        Alpine.store('fontSize', {
          current: n,
          set(v) {
            v = Math.max(14, Math.min(20, +v));
            this.current = v;
            document.documentElement.style.fontSize = v + 'px';
            try { localStorage.setItem('brick-fontsize', String(v)); } catch (e) {}
          },
        });
        document.documentElement.style.fontSize = n + 'px';
      })();
    });
  </script>

  <script src="{{ url_for('static', path='js/greetings.js') }}"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}" />
</head>

<body class="min-h-full text-stone-900 font-sans antialiased transition-colors duration-200 app-bg">

  <script>
  (function() {
    var p = (window.location.pathname || "").replace(/\/+$/, "");
    var strip = ["/tracker", "/file-compare", "/me"];
    for (var i = 0; i < strip.length; i++) {
      if (p.endsWith(strip[i])) {
        p = p.slice(0, p.length - strip[i].length);
        break;
      }
    }
    window.API_BASE = p;
    if (p === "") return;
    var _f = window.fetch;
    window.fetch = function(input) {
      if (typeof input === "string" && input.startsWith("/api/")) {
        arguments[0] = p + input;
      }
      return _f.apply(this, arguments);
    };
  })();
  </script>

  {% if shell_header | default(true) %}

          x-data="headerApp()" x-init="init()">

      <div class="flex items-center gap-2 sm:gap-3 min-w-0">
        <div class="relative flex-shrink-0">
          <button type="button"
                  @click="menuOpen = !menuOpen"
                  aria-label="模块菜单"
                  :aria-expanded="menuOpen ? 'true' : 'false'"
                  class="p-2 rounded-md hover:bg-stone-100 text-stone-500 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>

          <template x-teleport="body">
            <div x-show="menuOpen"
                 x-transition:enter="transition ease-out duration-150"
                 x-transition:enter-start="opacity-0"
                 x-transition:enter-end="opacity-100"
                 x-transition:leave="transition ease-in duration-100"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0"
                 @click="menuOpen = false"
                 class="fixed inset-0 calendar-backdrop z-[196]"></div>
          </template>

          <template x-teleport="body">
            <div x-show="menuOpen"
                 x-transition:enter="transition ease-out duration-150"
                 x-transition:enter-start="opacity-0 scale-95 -translate-y-1"
                 x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                 @click.stop
                 class="shell-module-menu fixed top-20 left-4 w-60 rounded-lg py-1 z-[197]">
              <a :href="navUrl('/')" @click="menuOpen=false"
                 class="flex items-center gap-2 px-3 py-2 text-sm rounded-lg mx-1 transition"
                 :class="moduleItemClass('welcome')">
                <span class="text-base">⌂</span> 欢迎首页
              </a>
              <a :href="navUrl('/tracker')" @click="menuOpen=false"
                 class="flex items-center gap-2 px-3 py-2 text-sm rounded-lg mx-1 transition"
                 :class="moduleItemClass('tracker')">
                <span class="text-base">◆</span> 日志追踪
              </a>
              <a :href="navUrl('/file-compare')" @click="menuOpen=false"
                 class="flex items-center gap-2 px-3 py-2 text-sm rounded-lg mx-1 transition"
                 :class="moduleItemClass('file-compare')">
                <span class="text-base">⧉</span> 文件预览与比对
              </a>
              <a :href="navUrl('/me')" @click="menuOpen=false"
                 class="flex items-center gap-2 px-3 py-2 text-sm rounded-lg mx-1 transition"
                 :class="moduleItemClass('me')">
                <span class="text-base">◈</span> 个人工作台
              </a>
            </div>
          </template>
        </div>

        <a :href="navUrl('/')" class="flex items-center gap-3 min-w-0 group">
          <img src="{{ url_for('static', path='img/PEAK logo.png') }}" alt="PEAK" width="300" height="80" class="h-16 w-auto flex-shrink-0 object-contain" />
          <div class="leading-tight min-w-0">
            <p class="text-xs text-stone-600 truncate max-w-[30rem] font-mono">Climb Higher. Work Smarter.</p>
            <p id="shell-greeting" class="shell-greeting text-sm text-stone-700 truncate max-w-[34rem]"></p>
          </div>
        </a>
      </div>

      <div class="flex items-center gap-1.5 flex-shrink-0">
        <div class="relative">
          <button type="button" @click="showCalendar = !showCalendar"
                  class="flex items-center gap-1.5 text-xs text-stone-600 hover:text-stone-900
                         px-2.5 h-8 rounded-md hover:bg-stone-100 transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <span x-text="todayStr" class="font-mono tabular-nums"></span>
          </button>

          <template x-teleport="body">
            <div x-show="showCalendar"
                 x-transition:enter="transition ease-out duration-150"
                 x-transition:enter-start="opacity-0"
                 x-transition:enter-end="opacity-100"
                 x-transition:leave="transition ease-in duration-100"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0"
                 @click="showCalendar = false"
                 class="fixed inset-0 calendar-backdrop z-[198]"></div>
          </template>

          <template x-teleport="body">
            <div x-show="showCalendar"
                 x-transition:enter="transition ease-out duration-150"
                 x-transition:enter-start="opacity-0 scale-95 -translate-y-1"
                 x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                 @click.outside="showCalendar = false"
                 class="shell-calendar-panel fixed top-14 right-4 w-72 rounded-lg p-4 z-[199]">
              <div class="flex items-center justify-between mb-3">
                <button type="button" @click="calPrev()" class="p-1 rounded-md hover:bg-stone-100 text-stone-500 transition">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
                  </svg>
                </button>
                <button type="button" @click="calToday()" class="text-sm font-semibold text-stone-800 hover:text-warm-600 transition" x-text="calTitle"></button>
                <button type="button" @click="calNext()" class="p-1 rounded-md hover:bg-stone-100 text-stone-500 transition">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
                  </svg>
                </button>
              </div>
              <div class="calendar-grid mb-1">
                <template x-for="wd in ['一','二','三','四','五','六','日']" :key="wd">
                  <div class="cal-cell text-stone-400 font-medium text-xs" x-text="wd"></div>
                </template>
              </div>
              <div class="calendar-grid">
                <template x-for="(d, idx) in calDays" :key="idx">
                  <div class="cal-cell"
                       :class="{ 'today': d.today, 'other-month': d.other }"
                       x-text="d.day"></div>
                </template>
              </div>
            </div>
          </template>
        </div>

        <div class="relative" x-show="currentUser">
          <button type="button" @click="userMenuOpen = !userMenuOpen"
                  class="flex items-center gap-2 pl-1 pr-2 h-8 rounded-full hover:bg-stone-100 transition">
            <span class="shell-user-avatar w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-semibold overflow-hidden">
              <img x-show="currentUser && currentUser.avatar_url"
                   :src="currentUser ? (currentUser.avatar_url + '?v=' + (currentUser.username || '')) : ''"
                   class="w-full h-full object-cover"
                   alt="avatar" />
              <span x-show="!currentUser || !currentUser.avatar_url"
                    x-text="currentUser ? (currentUser.display_name || currentUser.username || '?').charAt(0).toUpperCase() : '?'"></span>
            </span>
            <span class="text-xs font-medium text-stone-700 hidden sm:inline max-w-[8rem] truncate"
                  x-text="currentUser ? (currentUser.display_name || currentUser.username) : ''"></span>
            <svg class="w-3 h-3 text-stone-400 transition-transform" :class="userMenuOpen ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>

          <template x-teleport="body">
            <div x-show="userMenuOpen"
                 x-transition:enter="transition ease-out duration-150"
                 x-transition:enter-start="opacity-0"
                 x-transition:enter-end="opacity-100"
                 x-transition:leave="transition ease-in duration-100"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0"
                 @click="userMenuOpen = false"
                 class="fixed inset-0 calendar-backdrop z-[194]"></div>
          </template>

          <template x-teleport="body">
            <div x-show="userMenuOpen"
                 x-transition:enter="transition ease-out duration-150"
                 x-transition:enter-start="opacity-0 scale-95 -translate-y-1"
                 x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                 @click.stop
                 class="shell-user-menu fixed top-14 right-4 w-52 rounded-lg py-1 z-[195]">
              <a :href="navUrl('/me')" @click="userMenuOpen=false"
                 class="flex items-center gap-2 px-3 py-2 text-sm text-stone-700 hover:bg-stone-50 transition">
                <svg class="w-4 h-4 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
                个人工作台
              </a>
              <div class="px-3 py-2 border-t border-stone-100">
                <label class="flex items-center justify-between text-xs text-stone-500 mb-1">
                  <span>字号</span>
                  <span class="font-mono tabular-nums" x-text="$store.fontSize.current + 'px'"></span>
                </label>
                <input type="range" min="14" max="20" step="1"
                       :value="$store.fontSize.current"
                       @input="$store.fontSize.set(+$event.target.value)"
                       class="w-full h-1 accent-warm-500 cursor-pointer" />
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </header>
  {% endif %}

  {% block body %}{% endblock %}

  <!-- ============ Toast stack ============ -->
  <div x-data x-cloak
       class="fixed bottom-5 right-5 z-[200] flex flex-col gap-2 pointer-events-none w-[22rem] max-w-[calc(100vw-2rem)]">
    <template x-for="toast in $store.toast.items" :key="toast.id">
      <div x-transition:enter="transition ease-out duration-300"
           x-transition:enter-start="opacity-0 translate-x-3"
           x-transition:enter-end="opacity-100 translate-x-0"
           x-transition:leave="transition ease-in duration-200"
           x-transition:leave-start="opacity-100"
           x-transition:leave-end="opacity-0 translate-x-2"
           class="pointer-events-auto relative overflow-hidden flex items-start gap-3 px-4 py-3 rounded-xl shadow-pop ring-1 text-sm bg-white"
           :class="{
             'ring-emerald-200': toast.type === 'success',
             'ring-rose-200':       toast.type === 'error',
             'ring-stone-200':        toast.type === 'info',
             'ring-amber-200':     toast.type === 'warning'
           }">
        <span class="flex-shrink-0 w-5 h-5 rounded-full flex items-center justify-center mt-0.5"
              :class="{
                'bg-emerald-100 text-emerald-700': toast.type === 'success',
                'bg-rose-100 text-rose-700':             toast.type === 'error',
                'bg-stone-100 text-stone-700':            toast.type === 'info',
                'bg-amber-100 text-amber-700':        toast.type === 'warning'
              }">
          <svg x-show="toast.type === 'success'" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
          </svg>
          <svg x-show="toast.type === 'error'" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"/>
          </svg>
          <svg x-show="toast.type === 'info'" class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
            <circle cx="10" cy="10" r="4"/>
          </svg>
          <svg x-show="toast.type === 'warning'" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 9v3m0 4h.01"/>
          </svg>
        </span>
        <span x-text="toast.msg" class="flex-1 text-stone-800 font-medium leading-5 pt-px"></span>
        <button @click="$store.toast.remove(toast.id)"
                class="flex-shrink-0 text-stone-400 hover:text-stone-600 transition mt-px">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
        <span class="toast-bar"></span>
      </div>
    </template>
  </div>

  <!-- ============ Confirm Dialog ============ -->
  <div x-data x-cloak
       x-show="$store.confirm.open"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       x-transition:leave="transition ease-in duration-150"
       class="fixed inset-0 z-[300] flex items-center justify-center modal-backdrop">
    <div x-show="$store.confirm.open"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         class="bg-white rounded-2xl shadow-pop ring-1 ring-stone-200 max-w-sm w-full mx-4 p-6">
      <div class="flex items-start gap-4 mb-5">
        <div class="flex-shrink-0 w-10 h-10 rounded-full bg-rose-50 ring-1 ring-rose-200 flex items-center justify-center">
          <svg class="w-5 h-5 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M5 19h14a2 2 0 001.84-2.75L13.74 4a2 2 0 00-3.48 0l-7.1 12.25A2 2 0 005 19z"/>
          </svg>
        </div>
        <p class="flex-1 min-w-0 pt-1.5 text-base font-medium text-stone-900 leading-6"
           x-text="$store.confirm.message"></p>
      </div>
      <div class="flex justify-end gap-2">
        <button @click="$store.confirm.no()"
                class="px-3.5 h-9 text-sm font-medium text-stone-700 bg-stone-100 rounded-lg hover:bg-stone-200 transition">
          取消
        </button>
        <button @click="$store.confirm.yes()"
                class="px-3.5 h-9 text-sm font-medium text-white bg-rose-600 rounded-lg hover:bg-rose-700 transition shadow-sm">
          确认
        </button>
      </div>
    </div>
  </div>

  <!-- ============ Keyboard Shortcuts ============ -->
  <div x-data="{ open: false }"
       @keydown.window.prevent.shift.?="open = !open"
       @keydown.window.esc="open = false"
       x-cloak>
    <div x-show="open"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         @click.self="open = false"
         class="fixed inset-0 z-[250] flex items-center justify-center modal-backdrop">
      <div x-show="open"
           x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="opacity-0 scale-95"
           x-transition:enter-end="opacity-100 scale-100"
           class="bg-white rounded-2xl shadow-pop ring-1 ring-stone-200 max-w-sm w-full mx-4 p-6">
        <div class="flex items-center justify-between mb-5">
          <div class="flex items-center gap-2">
            <svg class="w-4 h-4 text-stone-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <h3 class="text-sm font-semibold text-stone-900">键盘快捷键</h3>
          </div>
          <button @click="open = false"
                  class="text-stone-400 hover:text-stone-600 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div class="space-y-2 text-sm text-stone-700">
          <div class="flex justify-between items-center py-1"><span>显示此面板</span><kbd>?</kbd></div>
          <div class="flex justify-between items-center py-1"><span>聚焦搜索</span><kbd>/</kbd></div>
          <div class="flex justify-between items-center py-1"><span>刷新数据</span><kbd>r</kbd></div>
          <div class="flex justify-between items-center py-1"><span>关闭弹窗</span><kbd>Esc</kbd></div>
          <div class="flex justify-between items-center py-1"><span>战术侦察 · 悬停看详情</span><kbd>Space</kbd></div>
          <div class="flex justify-between items-center py-1"><span>跳转工作台</span><span class="flex gap-1"><kbd>g</kbd><kbd>m</kbd></span></div>
        </div>
      </div>
