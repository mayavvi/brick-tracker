<!DOCTYPE html>
<html lang="zh-CN" class="h-full antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 — 打工人の进度小站</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            warm: { 300:'#36E7FF', 400:'#0DD1F2', 500:'#06B6D4', 600:'#0891B2', 700:'#0E7490' },
            neon: { 400:'#E247FF', 500:'#D01FF6' },
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'Menlo', 'Consolas', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background:
        radial-gradient(900px 500px at 85% 0%, rgba(208, 31, 246, 0.18), transparent 60%),
        radial-gradient(700px 400px at 0% 100%, rgba(6, 182, 212, 0.18), transparent 60%),
        linear-gradient(rgba(6,182,212,0.06) 1px, transparent 1px) 0 0 / 44px 44px,
        linear-gradient(90deg, rgba(6,182,212,0.06) 1px, transparent 1px) 0 0 / 44px 44px,
        #05070E;
      color: #E8EDFA;
    }
    @keyframes neon-pulse {
      0%,100% { box-shadow: 0 0 18px rgba(6,182,212,0.45), 0 0 32px rgba(208,31,246,0.25); }
      50%     { box-shadow: 0 0 28px rgba(6,182,212,0.7),  0 0 50px rgba(208,31,246,0.4); }
    }
    .btn-neon {
      background: linear-gradient(90deg, #06B6D4 0%, #D01FF6 100%);
      background-size: 200% 100%;
      transition: background-position 500ms ease;
      animation: neon-pulse 2.8s ease-in-out infinite;
    }
    .btn-neon:hover:not(:disabled) { background-position: 100% 50%; }
  </style>
</head>
<body class="h-full font-sans flex items-center justify-center">

  <div id="login-card" class="w-full max-w-sm mx-4">
    <div class="text-center mb-8">
      <div class="relative w-16 h-16 mx-auto mb-4">
        <div class="absolute inset-0 rounded-2xl bg-gradient-to-br from-warm-500 to-neon-500 blur-xl opacity-60"></div>
        <div class="relative w-16 h-16 rounded-2xl bg-gradient-to-br from-warm-500 to-neon-500 flex items-center justify-center text-3xl shadow-2xl">🧱</div>
      </div>
      <h1 class="text-2xl font-bold tracking-tight">
        <span data-text="BRICK" class="cfx-glitch bg-gradient-to-r from-warm-300 via-neon-400 to-warm-300 bg-clip-text text-transparent">BRICK</span>
        <span class="text-stone-500 font-mono text-sm">//</span>
        <span class="text-stone-100">控制台</span>
      </h1>
      <p class="text-xs font-mono text-warm-300 mt-2 tracking-wider">[ AUTH REQUIRED · 身份验证 ]</p>
    </div>

    <div class="relative">
      <div class="absolute -inset-[1px] rounded-2xl bg-gradient-to-br from-warm-500/50 via-neon-500/40 to-warm-500/50 blur-[2px]"></div>
      <div class="relative bg-[#0F1524]/90 backdrop-blur rounded-2xl ring-1 ring-warm-500/30 p-6">
        <form id="login-form" onsubmit="return handleLogin(event)">
          <label for="username" class="block text-[10px] font-bold uppercase tracking-[0.2em] text-warm-300 mb-2 font-mono">
            ▸ USER_ID · 用户名
          </label>
          <input id="username" name="username" type="text" required autofocus
                 placeholder="// 输入 Posit Connect 账号"
                 class="w-full px-3.5 py-2.5 text-sm rounded-lg bg-[#05070E]/60 border border-warm-500/30 text-stone-100
                        focus:outline-none focus:ring-2 focus:ring-warm-400/40 focus:border-warm-400
                        focus:shadow-[0_0_18px_rgba(6,182,212,0.35)]
                        placeholder:text-stone-600 font-mono transition" />

          <p id="error-msg" class="text-xs text-rose-400 mt-2 hidden font-mono"></p>

          <button type="submit" id="login-btn"
                  class="btn-neon w-full mt-5 h-11 text-sm font-bold text-white rounded-lg tracking-[0.15em]">
            ◈ 接入系统
          </button>
        </form>
      </div>
    </div>

    <p class="text-center text-[11px] text-stone-500 mt-6 font-mono">
      // 没有权限？联系管理员加入 ALLOW_LIST
    </p>
  </div>

  <script>
  (function() {
    var base = window.location.pathname.replace(/\/login\/?$/, '').replace(/\/+$/, '');
    window._base = base;
  })();

  async function handleLogin(e) {
    e.preventDefault();
    var btn = document.getElementById('login-btn');
    var errEl = document.getElementById('error-msg');
    var username = document.getElementById('username').value.trim();
    errEl.classList.add('hidden');

    if (!username) {
      errEl.textContent = '[ ERR ] 请输入用户名';
      errEl.classList.remove('hidden');
      return false;
    }

    btn.disabled = true;
    btn.textContent = '▰▰▰ 验证中…';

    try {
      var resp = await fetch(window._base + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username }),
      });
      var data = await resp.json();
      if (data.ok) {
        window.location.href = window._base + '/';
      } else {
        errEl.textContent = '[ ERR ] ' + (data.message || '登录失败');
        errEl.classList.remove('hidden');
      }
    } catch (err) {
      errEl.textContent = '[ ERR ] 网络错误: ' + err;
      errEl.classList.remove('hidden');
    } finally {
      btn.disabled = false;
      btn.textContent = '◈ 接入系统';
    }
    return false;
  }
  </script>
</body>
</html>
