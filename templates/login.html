<!DOCTYPE html>
<html lang="zh-CN" class="h-full antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - PEAK</title>

  <script>
    (function () {
      try {
        var fs = localStorage.getItem('brick-fontsize');
        var n = parseInt(fs, 10);
        if (isNaN(n) || n < 14 || n > 20) n = 16;
        document.documentElement.style.fontSize = n + 'px';
      } catch (e) { document.documentElement.style.fontSize = '16px'; }
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            warm: { 50:'#F4FBF8', 100:'#DDF3EA', 200:'#B9E4D6', 300:'#86CFB9', 400:'#4CB295', 500:'#2E9279', 600:'#247662', 700:'#205F51' },
            neon: { 50:'#FFF4F8', 100:'#FFE3EE', 300:'#F4A9C7', 500:'#DB5D91', 700:'#A73568' },
          },
          fontFamily: {
            sans: ['"Segoe UI"', '"Microsoft YaHei"', '"PingFang SC"', '"Helvetica Neue"', 'Arial', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'Menlo', 'Consolas', 'monospace'],
            serif: ['Georgia', '"Times New Roman"', 'serif'],
          },
          boxShadow: {
            card: '0 22px 70px -42px rgba(44, 36, 24, 0.38), 0 12px 30px -22px rgba(44, 36, 24, 0.25)',
          },
        }
      }
    }
  </script>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}" />
</head>
<body class="login-editorial min-h-full font-sans text-stone-900">
  <main class="relative min-h-screen overflow-hidden px-6 py-10">
    <div class="mx-auto flex min-h-[calc(100vh-5rem)] w-full max-w-5xl items-center justify-center">
      <section class="grid w-full gap-8 md:grid-cols-[1.05fr_0.95fr] md:items-center">
        <div class="max-w-xl">
          <img src="{{ url_for('static', path='img/PEAK logo.png') }}" alt="PEAK" width="220" height="72" class="h-16 w-auto object-contain" />
          <p class="mt-3 text-sm font-mono text-stone-600">Climb Higher. Work Smarter.</p>
          <h1 class="mt-12 font-serif text-5xl leading-tight tracking-normal text-stone-950 md:text-6xl">PEAK</h1>
          <p class="mt-5 max-w-lg text-lg leading-8 text-stone-650">
            登录后进入你的项目效率工作台，集中处理日志追踪、文件预览与个人待办。
          </p>
        </div>

        <div class="rounded-[1.4rem] border border-stone-200 bg-white/86 p-6 shadow-card backdrop-blur md:p-7">
          <div class="mb-6">
            <p class="text-xs font-semibold uppercase tracking-[0.18em] text-warm-700">Authentication</p>
            <h2 class="mt-2 text-2xl font-semibold tracking-normal text-stone-950">登录账号</h2>
          </div>

          <form id="login-form" onsubmit="return handleLogin(event)" class="space-y-4">
            <label class="block">
              <span class="mb-2 block text-sm font-medium text-stone-700">用户名</span>
              <input id="username" name="username" type="text" required autofocus
                     placeholder="输入 Posit Connect 账号"
                     class="h-11 w-full rounded-xl border border-stone-300 bg-[#fffdf8] px-3.5 text-sm text-stone-900 outline-none transition placeholder:text-stone-400 focus:border-warm-500 focus:ring-4 focus:ring-warm-200/60" />
            </label>

            <label class="block">
              <span class="mb-2 block text-sm font-medium text-stone-700">密码</span>
              <input id="password" name="password" type="password" required
                     placeholder="由管理员分配"
                     class="h-11 w-full rounded-xl border border-stone-300 bg-[#fffdf8] px-3.5 text-sm text-stone-900 outline-none transition placeholder:text-stone-400 focus:border-warm-500 focus:ring-4 focus:ring-warm-200/60" />
            </label>

            <p id="error-msg" class="hidden text-sm text-rose-600"></p>

            <button type="submit" id="login-btn"
                    class="h-11 w-full rounded-xl bg-stone-950 px-4 text-sm font-semibold text-white transition hover:bg-warm-700 disabled:cursor-not-allowed disabled:opacity-60">
              登录
            </button>
          </form>

          <p class="mt-5 text-xs leading-5 text-stone-500">
            没有权限时请联系管理员加入允许列表。
          </p>
        </div>
      </section>
    </div>
  </main>

  <script>
  (function() {
    var base = window.location.pathname.replace(/\/login\/?$/, '').replace(/\/+$/, '');
    window._base = base;
  })();

  async function handleLogin(e) {
    e.preventDefault();
    var btn = document.getElementById('login-btn');
    var errEl = document.getElementById('error-msg');
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;
    errEl.classList.add('hidden');

    if (!username) {
      errEl.textContent = '请输入用户名';
      errEl.classList.remove('hidden');
      return false;
    }
    if (!password) {
      errEl.textContent = '请输入密码';
      errEl.classList.remove('hidden');
      return false;
    }

    btn.disabled = true;
    btn.textContent = '验证中...';

    try {
      var resp = await fetch(window._base + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password }),
      });
      var data = await resp.json();
      if (data.ok) {
        sessionStorage.setItem('brick-just-logged-in', '1');
        window.location.href = window._base + '/';
      } else {
        errEl.textContent = data.message || '登录失败';
        errEl.classList.remove('hidden');
      }
    } catch (err) {
      errEl.textContent = '网络错误: ' + err;
      errEl.classList.remove('hidden');
    } finally {
      btn.disabled = false;
      btn.textContent = '登录';
    }
    return false;
  }
  </script>
</body>
</html>
