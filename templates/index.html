{% extends "base.html" %}
{% block body %}
<div x-data="trackerApp()" x-init="init()" class="flex flex-col h-full">

  <!-- ==================== Header ==================== -->
  <header class="flex-shrink-0 bg-white/95 dark:bg-stone-900/95 backdrop-blur border-b border-stone-200 dark:border-stone-800">
    <div class="max-w-screen-2xl mx-auto px-6 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="inline-block w-2 h-2 rounded-full bg-warm-500"></span>
        <div class="leading-tight">
          <h1 class="text-[15px] font-semibold text-stone-900 dark:text-stone-100 tracking-tight">
            打工人の进度小站
          </h1>
          <p class="text-[11px] text-stone-500 dark:text-stone-400 truncate max-w-[30rem]" x-text="greeting"></p>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <!-- Today + calendar -->
        <div class="relative">
          <button @click="showCalendar = !showCalendar"
                  class="flex items-center gap-1.5 text-xs text-stone-600 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-100
                         px-2.5 h-8 rounded-md hover:bg-stone-100 dark:hover:bg-stone-800 transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <span x-text="todayStr" class="font-mono tabular-nums"></span>
          </button>

          <div x-show="showCalendar"
               x-transition:enter="transition ease-out duration-150"
               x-transition:enter-start="opacity-0 scale-95 -translate-y-1"
               x-transition:enter-end="opacity-100 scale-100 translate-y-0"
               @click.outside="showCalendar = false"
               class="absolute right-0 mt-1.5 w-72 bg-white dark:bg-stone-900 rounded-xl shadow-pop ring-1 ring-stone-200 dark:ring-stone-800 p-4 z-50">
            <div class="flex items-center justify-between mb-3">
              <button @click="calPrev()" class="p-1 rounded-md hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-500 transition">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
                </svg>
              </button>
              <button @click="calToday()" class="text-sm font-semibold text-stone-800 dark:text-stone-200 hover:text-warm-600 transition" x-text="calTitle"></button>
              <button @click="calNext()" class="p-1 rounded-md hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-500 transition">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
                </svg>
              </button>
            </div>
            <div class="calendar-grid mb-1">
              <template x-for="wd in ['一','二','三','四','五','六','日']" :key="wd">
                <div class="cal-cell text-stone-400 dark:text-stone-500 font-medium text-xs" x-text="wd"></div>
              </template>
            </div>
            <div class="calendar-grid">
              <template x-for="(d, idx) in calDays" :key="idx">
                <div class="cal-cell"
                     :class="{ 'today': d.today, 'other-month': d.other }"
                     x-text="d.day"></div>
              </template>
            </div>
          </div>
        </div>

        <!-- Theme toggle -->
        <button @click="$store.theme.toggle(); _scheduleSavePrefs()"
                aria-label="切换主题"
                class="p-2 rounded-md hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-500 dark:text-stone-400 transition">
          <svg x-show="!$store.theme.dark" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
          <svg x-show="$store.theme.dark" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
        </button>

        <!-- User menu -->
        <div x-data="{ userMenuOpen: false }" class="relative" x-show="currentUser">
          <button @click="userMenuOpen = !userMenuOpen"
                  @click.outside="userMenuOpen = false"
                  class="flex items-center gap-2 pl-1 pr-2 h-8 rounded-full hover:bg-stone-100 dark:hover:bg-stone-800 transition">
            <span class="w-6 h-6 rounded-full bg-warm-500 text-white flex items-center justify-center text-[11px] font-semibold"
                  x-text="currentUser ? (currentUser.display_name || currentUser.username || '?').charAt(0).toUpperCase() : '?'"></span>
            <span class="text-xs font-medium text-stone-700 dark:text-stone-300"
                  x-text="currentUser ? (currentUser.display_name || currentUser.username) : ''"></span>
            <svg class="w-3 h-3 text-stone-400 transition-transform" :class="userMenuOpen ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <div x-show="userMenuOpen"
               x-transition:enter="transition ease-out duration-150"
               x-transition:enter-start="opacity-0 scale-95 -translate-y-1"
               x-transition:enter-end="opacity-100 scale-100 translate-y-0"
               class="absolute right-0 mt-1.5 w-40 bg-white dark:bg-stone-900 rounded-xl shadow-pop ring-1 ring-stone-200 dark:ring-stone-800 py-1 z-50">
            <a href="/me"
               class="flex items-center gap-2 px-3 py-2 text-sm text-stone-700 dark:text-stone-300 hover:bg-stone-50 dark:hover:bg-stone-800 transition">
              <svg class="w-4 h-4 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
              个人工作台
            </a>
            <button @click="$store.theme.toggle(); _scheduleSavePrefs(); userMenuOpen=false"
                    class="w-full flex items-center gap-2 px-3 py-2 text-sm text-stone-700 dark:text-stone-300 hover:bg-stone-50 dark:hover:bg-stone-800 transition text-left">
              <svg class="w-4 h-4 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
              </svg>
              <span x-text="$store.theme.dark ? '切换为浅色' : '切换为深色'"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ==================== Layout ==================== -->
  <div class="flex flex-1 overflow-hidden max-w-screen-2xl mx-auto w-full">

    <!-- ==================== Sidebar ==================== -->
    <div class="sidebar-wrapper flex-shrink-0 bg-white dark:bg-stone-900 border-r border-stone-200 dark:border-stone-800 relative"
         :class="sidebarOpen ? 'sidebar-expanded' : 'sidebar-collapsed'">

      <button x-show="!sidebarOpen" @click="toggleSidebar()"
              class="absolute inset-0 w-full h-full flex items-start pt-6 justify-center
                     text-stone-400 hover:text-stone-700 dark:hover:text-stone-200 hover:bg-stone-50 dark:hover:bg-stone-800 transition-colors cursor-pointer"
              title="展开面板">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7"/>
        </svg>
      </button>

      <aside class="sidebar-content p-5 space-y-5"
             :class="sidebarOpen ? 'sidebar-content-visible' : 'sidebar-content-hidden'">

        <div class="flex justify-end -mt-2 -mr-2">
          <button @click="toggleSidebar()"
                  class="p-1.5 rounded-md hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-400 hover:text-stone-700 dark:hover:text-stone-200 transition"
                  title="收起面板">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
            </svg>
          </button>
        </div>

        <!-- Search -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs font-semibold uppercase tracking-wider text-stone-500 dark:text-stone-400">项目</label>
            <button @click="refreshProjectList()"
                    :disabled="refreshingCache"
                    class="text-[11px] text-stone-400 hover:text-warm-600 dark:hover:text-warm-400 flex items-center gap-1 transition disabled:opacity-40"
                    title="刷新项目列表">
              <svg class="w-3 h-3" :class="refreshingCache ? 'animate-spin' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
              </svg>
              <span x-text="refreshingCache ? '刷新中' : '刷新'"></span>
            </button>
          </div>
          <input id="study-search-input" type="text" x-model="searchQuery"
                 @input.debounce.300ms="searchStudies()"
                 placeholder="关键词搜索，如 QLC5508"
                 class="w-full rounded-md border border-stone-300 dark:border-stone-700 bg-white dark:bg-stone-950 px-3 h-9 text-sm
                        text-stone-900 dark:text-stone-100 placeholder:text-stone-400
                        focus:ring-2 focus:ring-warm-400/40 focus:border-warm-400 outline-none transition" />
        </div>

        <!-- Study list -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs font-semibold uppercase tracking-wider text-stone-500 dark:text-stone-400">已选</label>
            <span class="text-[11px] text-stone-400" x-show="selectedStudies.length > 0"
                  x-text="selectedStudies.length + ' 个'"></span>
          </div>
          <div class="rounded-md border border-stone-200 dark:border-stone-800 max-h-60 overflow-y-auto bg-white dark:bg-stone-950">
            <template x-if="studyList.length === 0 && !loadingStudies">
              <p class="text-xs text-stone-400 px-3 py-6 text-center">输入关键词搜索项目</p>
            </template>
            <template x-if="loadingStudies">
              <p class="text-xs text-stone-400 px-3 py-6 text-center">搜索中…</p>
            </template>
            <template x-for="study in studyList" :key="study.study_id">
              <div class="px-3 py-2 border-b border-stone-100 dark:border-stone-800 last:border-0">
                <label class="flex items-center gap-2 cursor-pointer text-sm text-stone-800 dark:text-stone-200">
                  <input type="checkbox" :value="study.study_id"
                         x-model="selectedStudies"
                         @change="onStudyToggle(study)"
                         class="rounded border-stone-300 dark:border-stone-600" />
                  <span class="font-medium" x-text="study.study_id"></span>
                </label>
                <div class="flex flex-wrap gap-1 mt-1.5 ml-6" x-show="study.tracker_files.length > 0">
                  <template x-for="tf in study.tracker_files" :key="tf.file_path">
                    <button type="button"
                            @click="toggleTrackerFile(study.study_id, tf.file_path)"
                            :class="isTrackerSelected(study.study_id, tf.file_path)
                              ? 'bg-warm-500 text-white'
                              : 'bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-400 hover:bg-stone-200 dark:hover:bg-stone-700'"
                            class="text-[11px] px-2 py-0.5 rounded-full font-medium transition"
                            x-text="tf.task_purpose"></button>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- Person -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 dark:text-stone-400 mb-1.5">成员</label>
          <select x-model="personFilter"
                  class="w-full rounded-md border border-stone-300 dark:border-stone-700 bg-white dark:bg-stone-950 px-3 h-9 text-sm
                         text-stone-900 dark:text-stone-100
                         focus:ring-2 focus:ring-warm-400/40 focus:border-warm-400 outline-none transition">
            <option value="">全部成员</option>
            <template x-for="p in personList" :key="p">
              <option :value="p" x-text="p"></option>
            </template>
          </select>
        </div>

        <!-- Role -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 dark:text-stone-400 mb-1.5">角色</label>
          <div class="inline-flex w-full rounded-md border border-stone-200 dark:border-stone-800 bg-stone-50 dark:bg-stone-950 p-0.5">
            <template x-for="r in [{v:'all',l:'全部'},{v:'main',l:'主做'},{v:'qc',l:'QC'}]" :key="r.v">
              <button @click="roleFilter = r.v"
                      :class="roleFilter === r.v
                        ? 'bg-white dark:bg-stone-800 text-stone-900 dark:text-stone-100 shadow-soft'
                        : 'text-stone-500 dark:text-stone-400 hover:text-stone-700 dark:hover:text-stone-200'"
                      class="flex-1 text-xs rounded py-1.5 font-medium transition"
                      x-text="r.l"></button>
            </template>
          </div>
        </div>

        <!-- Time range -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 dark:text-stone-400 mb-1.5">截止日期</label>
          <div class="grid grid-cols-3 gap-1">
            <template x-for="t in [{v:'',l:'全部'},{v:'3d',l:'3天内'},{v:'5d',l:'5天内'},{v:'10d',l:'10天内'},{v:'15d',l:'15天内'},{v:'15d+',l:'更远'}]" :key="t.v">
              <button @click="timeRange = t.v"
                      :class="timeRange === t.v
                        ? 'bg-warm-500 text-white border-warm-500'
                        : 'bg-white dark:bg-stone-950 text-stone-600 dark:text-stone-400 border-stone-200 dark:border-stone-800 hover:border-warm-300 hover:text-warm-600'"
                      class="text-xs rounded-md py-1.5 font-medium border transition"
                      x-text="t.l"></button>
            </template>
          </div>
        </div>

        <!-- Load -->
        <button @click="loadDashboard()"
                :disabled="selectedStudies.length === 0 || loadingDashboard"
                class="w-full bg-warm-600 hover:bg-warm-700 disabled:bg-stone-200 dark:disabled:bg-stone-800
                       disabled:text-stone-400 disabled:cursor-not-allowed
                       text-white text-sm font-semibold h-10 rounded-md transition shadow-soft">
          <span x-show="!loadingDashboard">加载看板</span>
          <span x-show="loadingDashboard">加载中…</span>
        </button>
      </aside>
    </div>

    <!-- ==================== Main Content ==================== -->
    <main class="flex-1 overflow-y-auto p-6 space-y-4 bg-stone-50 dark:bg-stone-950">

      <!-- Empty state -->
      <template x-if="!dashboardLoaded && !loadingDashboard">
        <div class="flex flex-col items-center justify-center min-h-[60vh] gap-6">
          <div class="text-center space-y-2">
            <div class="w-14 h-14 mx-auto rounded-full bg-stone-100 dark:bg-stone-800 flex items-center justify-center">
              <svg class="w-6 h-6 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
              </svg>
            </div>
            <p class="text-base text-stone-700 dark:text-stone-300 font-medium">还没加载看板</p>
            <p class="text-sm text-stone-500 dark:text-stone-500">从左侧选择项目后点「加载看板」</p>
          </div>
          <button @click="openAddCustomTask('')"
                  class="px-4 h-9 border border-dashed border-stone-300 dark:border-stone-700 rounded-md text-sm
                         text-stone-600 dark:text-stone-400 hover:border-warm-400 hover:text-warm-600 transition
                         flex items-center gap-2 font-medium">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
            </svg>
            新增自定义任务
          </button>

          <template x-if="customProjectGroups.length > 0">
            <div class="w-full space-y-3 mt-2">
              <template x-for="cg in customProjectGroups" :key="cg.studyId">
                <div class="bg-white dark:bg-stone-900 rounded-lg border border-stone-200 dark:border-stone-800 overflow-hidden">
                  <div class="flex items-center justify-between px-4 py-3 border-l-2 border-l-warm-500">
                    <span class="flex items-center gap-2.5">
                      <span class="font-semibold text-stone-900 dark:text-stone-100 text-sm" x-text="cg.studyId"></span>
                      <span class="text-[11px] bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-400 rounded-full px-2 py-0.5 font-medium"
                            x-text="cg.tasks.length + ' 项'"></span>
                    </span>
                    <button @click="openAddCustomTask(cg.studyId)"
                            class="text-xs text-stone-500 hover:text-warm-600 rounded px-2 py-1 font-medium transition flex items-center gap-1">
                      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                      </svg>
                      新增
                    </button>
                  </div>
                  <div class="overflow-x-auto border-t border-stone-100 dark:border-stone-800">
                    <table class="min-w-full text-sm">
                      <thead>
                        <tr class="bg-stone-50 dark:bg-stone-950/60 text-stone-500 dark:text-stone-400 text-[11px] uppercase tracking-wider">
                          <th class="px-3 py-2 text-left font-medium">任务</th>
                          <th class="px-3 py-2 text-left font-medium">主做</th>
                          <th class="px-3 py-2 text-left font-medium">状态</th>
                          <th class="px-3 py-2 text-left font-medium">QC</th>
                          <th class="px-3 py-2 text-left font-medium">QC 状态</th>
                          <th class="px-3 py-2 text-left font-medium">DDL</th>
                          <th class="px-3 py-2 text-left font-medium w-16"></th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-stone-100 dark:divide-stone-800">
                        <template x-for="ct in cg.tasks" :key="ct.id">
                          <tr class="hover:bg-stone-50 dark:hover:bg-stone-800/40 transition-colors group">
                            <td class="px-3 py-2 text-stone-800 dark:text-stone-200 font-medium" x-text="ct.task_name"></td>
                            <td class="px-3 py-2 whitespace-nowrap text-xs text-stone-600 dark:text-stone-400" x-text="ct.main_person || '—'"></td>
                            <td class="px-3 py-2 whitespace-nowrap">
                              <span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium"
                                    :class="statusBadge(ct.main_status)" x-text="ct.main_status || '—'"></span>
                            </td>
                            <td class="px-3 py-2 whitespace-nowrap text-xs text-stone-600 dark:text-stone-400" x-text="ct.qc_person || '—'"></td>
                            <td class="px-3 py-2 whitespace-nowrap">
                              <span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium"
                                    :class="statusBadge(ct.qc_status)" x-text="ct.qc_status || '—'"></span>
                            </td>
                            <td class="px-3 py-2 whitespace-nowrap font-mono text-xs text-stone-500 tabular-nums" x-text="ct.ddl || '—'"></td>
                            <td class="px-3 py-2 whitespace-nowrap">
                              <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button @click="openEditCustomTask(ct)" class="text-stone-400 hover:text-warm-600 transition p-0.5" title="编辑">
                                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                                  </svg>
                                </button>
                                <button @click="deleteCustomTask(ct.id)" class="text-stone-400 hover:text-rose-500 transition p-0.5" title="删除">
                                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                  </svg>
                                </button>
                              </div>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>

      <!-- Skeleton loader -->
      <template x-if="loadingDashboard && !dashboardLoaded">
        <div class="space-y-4">
          <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
            <template x-for="i in [1,2,3,4,5,6]" :key="i">
              <div class="rounded-lg border border-stone-200 dark:border-stone-800 bg-white dark:bg-stone-900 p-4 space-y-2">
                <div class="skeleton h-3 w-16 rounded"></div>
                <div class="skeleton h-7 w-10 rounded"></div>
              </div>
            </template>
          </div>
          <div class="rounded-lg border border-stone-200 dark:border-stone-800 bg-white dark:bg-stone-900 overflow-hidden">
            <div class="skeleton h-12 w-full rounded-none"></div>
            <template x-for="i in [1,2,3,4]" :key="i">
              <div class="border-t border-stone-100 dark:border-stone-800 px-4 py-3 flex gap-4">
                <div class="skeleton h-4 w-24 rounded"></div>
                <div class="skeleton h-4 w-32 rounded"></div>
                <div class="skeleton h-4 w-20 rounded"></div>
                <div class="skeleton h-4 w-16 rounded"></div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- Dashboard -->
      <template x-if="dashboardLoaded">
        <div :key="animationKey" class="dashboard-content-enter space-y-4">
          {% include "components/summary_cards.html" %}

          <!-- Charts panel -->
          <div class="rounded-lg border border-stone-200 dark:border-stone-800 bg-white dark:bg-stone-900 overflow-hidden">
            <button @click="toggleCharts()"
                    class="w-full flex items-center justify-between px-4 py-2.5 text-xs font-semibold uppercase tracking-wider
                           text-stone-500 dark:text-stone-400 hover:bg-stone-50 dark:hover:bg-stone-800/40 transition">
              <span>概览图表</span>
              <svg :class="showCharts ? 'rotate-180' : ''" class="w-3.5 h-3.5 text-stone-400 transition-transform"
                   fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
              </svg>
            </button>
            <div x-show="showCharts" x-collapse>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4 p-4 border-t border-stone-100 dark:border-stone-800">
                <div>
                  <p class="text-[11px] text-stone-500 dark:text-stone-400 font-medium mb-2 text-center uppercase tracking-wider">任务状态分布</p>
                  <div class="chart-container"><canvas id="chart-donut"></canvas></div>
                </div>
                <div>
                  <p class="text-[11px] text-stone-500 dark:text-stone-400 font-medium mb-2 text-center uppercase tracking-wider">成员工作量</p>
                  <div class="chart-container"><canvas id="chart-bar"></canvas></div>
                </div>
                <div>
                  <p class="text-[11px] text-stone-500 dark:text-stone-400 font-medium mb-2 text-center uppercase tracking-wider">30 天 DDL 分布</p>
                  <div class="chart-container"><canvas id="chart-timeline"></canvas></div>
                </div>
              </div>
            </div>
          </div>

          {% include "components/task_table.html" %}
        </div>
      </template>
    </main>
  </div>

  <!-- ==================== Custom Task Modal ==================== -->
  <div x-show="showCustomTaskModal"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop"
       style="margin:0;top:0;left:0;width:100vw;height:100vh;"
       @click.self="showCustomTaskModal = false">
    <div x-show="showCustomTaskModal"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95 translate-y-4"
         x-transition:enter-end="opacity-100 scale-100 translate-y-0"
         class="bg-white dark:bg-stone-900 rounded-xl shadow-pop ring-1 ring-stone-200 dark:ring-stone-800 w-full max-w-lg mx-4 overflow-hidden max-h-[90vh] overflow-y-auto">
      <div class="px-6 py-4 border-b border-stone-200 dark:border-stone-800 flex items-center justify-between sticky top-0 bg-white dark:bg-stone-900 z-10">
        <h3 class="text-base font-semibold text-stone-900 dark:text-stone-100" x-text="editingCustomTask ? '编辑任务' : '新增任务'"></h3>
        <button @click="showCustomTaskModal = false" class="text-stone-400 hover:text-stone-700 dark:hover:text-stone-200 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <datalist id="dl-study-ids">
        <template x-for="sid in selectedStudies" :key="sid">
          <option :value="sid"></option>
        </template>
      </datalist>
      <datalist id="dl-task-names">
        <template x-for="tn in _taskNamePresets" :key="tn">
          <option :value="tn"></option>
        </template>
      </datalist>
      <datalist id="dl-persons">
        <template x-for="p in personList" :key="p">
          <option :value="p"></option>
        </template>
      </datalist>

      <div class="px-6 py-5 space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 dark:text-stone-400 mb-1.5">项目 ID <span class="text-rose-500 normal-case tracking-normal">*</span></label>
          <input type="text" x-model="customTaskForm.study_id" list="dl-study-ids"
                 class="w-full rounded-md border border-stone-300 dark:border-stone-700 bg-white dark:bg-stone-950 text-stone-900 dark:text-stone-100 px-3 h-9 text-sm focus:ring-2 focus:ring-warm-400/40 focus:border-warm-400 outline-none"
                 placeholder="选择已有或输入新的" />
          <div class="flex flex-wrap gap-1.5 mt-1.5" x-show="selectedStudies.length > 0 && !customTaskForm.study_id">
            <template x-for="sid in selectedStudies" :key="sid">
              <button type="button" @click="customTaskForm.study_id = sid"
                      class="text-[11px] px-2 py-0.5 rounded-full font-medium bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-400 hover:bg-stone-200 dark:hover:bg-stone-700 transition"
                      x-text="sid"></button>
            </template>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 dark:text-stone-400 mb-1.5">任务名称 <span class="text-rose-500 normal-case tracking-normal">*</span></label>
          <input type="text" x-model="customTaskForm.task_name" list="dl-task-names"
                 class="w-full rounded-md border border-stone-300 dark:border-stone-700 bg-white dark:bg-stone-950 text-stone-900 dark:text-stone-100 px-3 h-9 text-sm focus:ring-2 focus:ring-warm-400/40 focus:border-warm-400 outline-none"
                 placeholder="选择预设或自定义" />
          <div class="flex flex-wrap gap-1.5 mt-1.5">
            <template x-for="tn in _taskNamePresets" :key="tn">
              <button type="button" @click="customTaskForm.task_name = tn"
                      class="text-[11px] px-2 py-0.5 rounded-full font-medium transition"
                      :class="customTaskForm.task_name === tn
                        ? 'bg-warm-500 text-white'
                        : 'bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-400 hover:bg-stone-200 dark:hover:bg-stone-700'"
                      x-text="tn"></button>
            </template>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 dark:text-stone-400 mb-1.5">备注</label>
          <textarea x-model="customTaskForm.description" rows="2"
                    class="w-full rounded-md border border-stone-300 dark:border-stone-700 bg-white dark:bg-stone-950 text-stone-900 dark:text-stone-100 px-3 py-2 text-sm focus:ring-2 focus:ring-warm-400/40 focus:border-warm-400 outline-none resize-none"
                    placeholder="可选"></textarea>
        </div>

        <div class="rounded-md border border-stone-200 dark:border-stone-800 bg-stone-50 dark:bg-stone-950/40 p-3 space-y-3">
          <span class="text-[11px] font-semibold uppercase tracking-wider text-stone-500 dark:text-stone-400">主做</span>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[11px] text-stone-500 dark:text-stone-400 mb-1">负责人</label>
              <input type="text" x-model="customTaskForm.main_person" list="dl-persons"
                     class="w-full rounded-md border border-stone-300 dark:border-stone-700 bg-white dark:bg-stone-950 text-stone-900 dark:text-stone-100 px-3 h-9 text-sm focus:ring-2 focus:ring-warm-400/40 focus:border-warm-400 outline-none"
                     placeholder="选填" />
            </div>
            <div>
              <label class="block text-[11px] text-stone-500 dark:text-stone-400 mb-1">状态</label>
              <select x-model="customTaskForm.main_status"
                      class="w-full rounded-md border border-stone-300 dark:border-stone-700 bg-white dark:bg-stone-950 text-stone-900 dark:text-stone-100 px-3 h-9 text-sm focus:ring-2 focus:ring-warm-400/40 focus:border-warm-400 outline-none">
                <option value="">未开始</option>
                <option value="进行中">进行中</option>
                <option value="已完成，可以QC">已完成，可以QC</option>
                <option value="有问题，请修改">有问题，请修改</option>
                <option value="待定，请留意">待定，请留意</option>
                <option value="关闭问题">关闭问题</option>
              </select>
            </div>
          </div>
        </div>

        <div class="rounded-md border border-stone-200 dark:border-stone-800 bg-stone-50 dark:bg-stone-950/40 p-3 space-y-3">
          <span class="text-[11px] font-semibold uppercase tracking-wider text-stone-500 dark:text-stone-400">QC</span>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[11px] text-stone-500 dark:text-stone-400 mb-1">负责人</label>
              <input type="text" x-model="customTaskForm.qc_person" list="dl-persons"
                     class="w-full rounded-md border border-stone-300 dark:border-stone-700 bg-white dark:bg-stone-950 text-stone-900 dark:text-stone-100 px-3 h-9 text-sm focus:ring-2 focus:ring-warm-400/40 focus:border-warm-400 outline-none"
                     placeholder="选填" />
            </div>
            <div>
              <label class="block text-[11px] text-stone-500 dark:text-stone-400 mb-1">状态</label>
              <select x-model="customTaskForm.qc_status"
                      class="w-full rounded-md border border-stone-300 dark:border-stone-700 bg-white dark:bg-stone-950 text-stone-900 dark:text-stone-100 px-3 h-9 text-sm focus:ring-2 focus:ring-warm-400/40 focus:border-warm-400 outline-none">
                <option value="">未开始</option>
                <option value="进行中">进行中</option>
                <option value="已完成，可以QC">已完成，可以QC</option>
                <option value="有问题，请修改">有问题，请修改</option>
                <option value="待定，请留意">待定，请留意</option>
                <option value="关闭问题">关闭问题</option>
              </select>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 dark:text-stone-400 mb-1.5">DDL <span class="text-rose-500 normal-case tracking-normal">*</span></label>
            <input type="date" x-model="customTaskForm.ddl" required
                   class="w-full rounded-md border border-stone-300 dark:border-stone-700 bg-white dark:bg-stone-950 text-stone-900 dark:text-stone-100 px-3 h-9 text-sm focus:ring-2 focus:ring-warm-400/40 focus:border-warm-400 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 dark:text-stone-400 mb-1.5">标签</label>
            <input type="text" x-model="customTaskForm.tags"
                   class="w-full rounded-md border border-stone-300 dark:border-stone-700 bg-white dark:bg-stone-950 text-stone-900 dark:text-stone-100 px-3 h-9 text-sm focus:ring-2 focus:ring-warm-400/40 focus:border-warm-400 outline-none"
                   placeholder="逗号分隔" />
          </div>
        </div>
      </div>

      <div class="px-6 py-3 border-t border-stone-200 dark:border-stone-800 flex justify-end gap-2 sticky bottom-0 bg-white dark:bg-stone-900">
        <button @click="showCustomTaskModal = false"
                class="px-3.5 h-9 text-sm font-medium text-stone-700 dark:text-stone-300 bg-stone-100 dark:bg-stone-800 rounded-md hover:bg-stone-200 dark:hover:bg-stone-700 transition">
          取消
        </button>
        <button @click="saveCustomTask()"
                :disabled="!customTaskForm.task_name.trim() || !customTaskForm.study_id.trim() || !customTaskForm.ddl"
                class="px-3.5 h-9 text-sm font-medium text-white bg-warm-600 hover:bg-warm-700 disabled:bg-stone-300 dark:disabled:bg-stone-700 disabled:cursor-not-allowed rounded-md transition shadow-soft">
          <span x-text="editingCustomTask ? '保存' : '新增'"></span>
        </button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
